					document.documentElement.classList.add('dark-theme');
				}
			} catch (e) { }
		})();

	<title>Momotan Storage Explorer</title>
	<style>
		:root {
			--primary-color: #a74e66;
			--primary-color-grey: #555555;
			--primary-color-grey-disabled: #bbbbbb;
			--danger-color: #f44336;
			--light-bg: #f5f5f5;
			--dark-bg: #303030;
			--border-color: #ddd;
			--border-color-dark: #444;
			--now-bg-color: white;
		}

		.dark-theme {
			--primary-color: #ffc5d3;
			--primary-color-grey: #dddddd;
			--primary-color-grey-disabled: #777777;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			font-family: 'Segoe UI', Arial, sans-serif;
		}

		select {
			-webkit-appearance: none;
			-moz-appearance: none;
			appearance: none;
		}

		button:focus-visible {
			box-shadow: inset 0 0 0 1px var(--primary-color) !important;
			outline: none;
		}

		html {
			scrollbar-width: thin;
			scrollbar-color: rgba(150, 150, 150, 0.5) transparent;
		}

		html::-webkit-scrollbar {
			width: 4px;
		}

		html::-webkit-scrollbar-track {
			background: transparent;
		}

		body::-webkit-scrollbar-button {
			display: none;
		}

		body {
			display: flex;
			height: 100vh;
			/* 移动端浏览器地址栏伸缩时 dvh 跟随可视高度变化，vh 不会 */
			height: 100dvh;
			/* 应用外壳固定不滚动，滚动只发生在各面板内部 */
			overflow: hidden;
			background-color: #ffffff;
			color: #333;
			scrollbar-width: none;
			transition: all 0.2s ease;
		}

		html.dark-theme body {
			background-color: #252525;
			color: #eee;
			scrollbar-width: none;
		}

		.container {
			display: flex;
			width: 100%;
			height: 100%;
		}

		/* 左侧边栏 */
		.leftbar {
			width: 65px;
			background: white;
			border-right: 1px solid var(--border-color);
			height: 100%;
			display: flex;
			flex-direction: column;
			overflow-y: auto;
			overflow-x: hidden;
			transition: all 0.2s ease;
		}

		.dark-theme .leftbar {
			border-right: 1px solid var(--border-color-dark);
			background: #252525;
		}

		/* 存储类型列表 */
		.storage-type-list {
			width: 350px;
			background: white;
			border-right: 1px solid var(--border-color);
			height: 100%;
			display: flex;
			flex-direction: column;
			transition: all 0.2s ease;
		}

		.dark-theme .storage-type-list {
			border-right: 1px solid var(--border-color-dark);
			background: #252525;
		}

		.storage-type-header {
			padding: 16px 15px 9px 15px;
			border-bottom: 1px solid var(--border-color);
			transition: all 0.2s ease;
		}

		.dark-theme .storage-type-header {
			border-bottom: 1px solid var(--border-color-dark);
		}

		.storage-items-list {
			overflow-y: auto;
			flex: 1;
			/* flex 子项默认 min-height:auto 会拒绝收缩到比内容矮，
			   导致列表长高撑破容器、body 整体滚动；必须显式归零才能内部滚动 */
			min-height: 0;
			position: relative;
			scrollbar-width: none;
			margin-bottom: 0px;
			transition: all 0.2s ease;
		}

		.storage-item {
			padding: 15px 32px 15px 15px;
			height: 130px;
			border-bottom: 1px solid var(--border-color);
			border-left: 0px solid var(--primary-color);
			cursor: pointer;
			position: relative;
			-webkit-tap-highlight-color: transparent;
			transition: all 0.2s ease;
		}

		.dark-theme .storage-item {
			border-bottom: 1px solid var(--border-color-dark);
			border-left: 0px solid var(--primary-color);
		}

		/* localStorage / sessionStorage 列表使用紧凑行高 */
		.storage-items-list.compact-items .storage-item {
			padding: 7px 32px 7px 15px;
			height: 65px;
		}

		.storage-item:hover {
			background-color: var(--light-bg);
		}

		.dark-theme .storage-item:hover {
			background-color: var(--dark-bg);
		}

		.storage-item.selected {
			background-color: #faf0f3;
			box-shadow: inset 3px 0 0 var(--primary-color);
			transition: all 0.2s ease;
		}

		.dark-theme .storage-item.selected {
			background-color: #3a3537;
			box-shadow: inset 3px 0 0 var(--primary-color);
			transition: all 0.2s ease;
		}

		.storage-title {
			font-weight: 500;
			font-size: 17px;
			margin-bottom: 5px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.storage-size {
			font-size: 15px;
			color: #666;
			margin-bottom: 4px;
			transition: all 0.2s ease;
		}

		.dark-theme .storage-size {
			color: #aaa;
		}

		.storage-time {
			font-size: 13px;
			color: #999;
			margin-top: 4px;
		}

		/* 右侧编辑区域 */
		.editor {
			flex: 1;
			display: flex;
			flex-direction: column;
			background: white;
			height: 100%;
			transition: all 0.2s ease;
		}

		.dark-theme .editor {
			background: #252525;
		}

		.editor-header {
			height: 65px;
			padding: 15px 15px 15px 20px;
			border-bottom: 1px solid var(--border-color);
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 5px;
			transition: all 0.2s ease;
		}

		.dark-theme .editor-header {
			border-bottom: 1px solid var(--border-color-dark);
		}

		.storage-detail-title {
			flex: 1;
			font-size: 19px;
			font-weight: 600;
			color: #333;
			word-break: break-all;
			transition: all 0.2s ease;
		}

		.dark-theme .storage-detail-title {
			color: #eee;
		}

		.editor-actions {
			display: flex;
			gap: 5px;
		}

		.editor-body {
			flex: 1;
			/* 同上：允许 flex 子项收缩，内容超出时内部滚动 */
			min-height: 0;
			padding: 0px;
			overflow-y: auto;
		}

		.placeholder {
			position: relative;
			color: #aaa;
			font-size: 16px;
			transform: translateY(3px);
			transition: all 0.2s ease;
		}

		.placeholder2 {
			position: relative;
			color: #aaa;
			font-size: 16px;
			margin: 10px 12px;
			transition: all 0.2s ease;
		}

		svg {
			width: 22px;
			height: 22px;
		}

		.storage-summary {
			position: relative;
			padding: 0;
			height: 195px;
			background-color: #f9f9f9;
			transition: all 0.2s ease;
			display: flex;
			flex-direction: column;
		}

		.dark-theme .storage-summary {
			background-color: #2d2d2d;
		}

		/* summary 三组（信息 / 搜索 / 操作按钮）各 65px，与 storage-item 一样以底部分隔线分隔 */
		.summary-info {
			height: 65px;
			padding: 0 15px;
			display: flex;
			flex-direction: column;
			justify-content: center;
			border-bottom: 1px solid var(--border-color);
			transition: all 0.2s ease;
		}

		.dark-theme .summary-info {
			border-bottom: 1px solid var(--border-color-dark);
		}

		.summary-item {
			font-size: 16px;
			display: flex;
			justify-content: space-between;
			margin-bottom: 3.5px;
			min-height: 28px;
			transition: all 0.2s ease;
		}

		.summary-label {
			font-size: 16px;
			font-weight: 500;
			color: #555;
			transition: all 0.2s ease;
		}

		.dark-theme .summary-label {
			color: #ccc;
		}

		.summary-value {
			font-size: 16px;
			color: #333;
			font-weight: 600;
			transition: all 0.2s ease;
		}

		.dark-theme .summary-value {
			color: #eee;
		}

		.usage-bar {
			height: 8px;
			background-color: #e0e0e0;
			border-radius: 4px;
			margin: 0 0 1.5px 0;
			overflow: hidden;
			transition: all 0.2s ease;
		}

		.dark-theme .usage-bar {
			background-color: #444;
		}

		.usage-progress {
			height: 100%;
			background-color: var(--primary-color);
			border-radius: 4px;
			transition: background-color 0.2s ease, width 0.5s ease;
		}

		.dark-theme .usage-progress {
			background-color: #ffccd8;
		}

		.search-input-wrapper {
			position: relative;
			width: 100%;
			height: 65px;
			border-bottom: 1px solid var(--border-color);
			transition: all 0.2s ease;
		}

		.dark-theme .search-input-wrapper {
			border-bottom: 1px solid var(--border-color-dark);
		}

		.search-icon {
			position: absolute;
			left: 12px;
			top: 50%;
			transform: translateY(-50%);
			width: 20px;
			height: 20px;
			color: #999;
			pointer-events: none;
			transition: all 0.2s ease;
		}

		.search-input {
			width: 100%;
			height: 100%;
			min-width: 0px;
			padding: 0 12px 0 40px;
			border: 1px solid transparent;
			background: none;
			color: #333;
			font-size: 16px;
			outline: none;
			transition: all 0.2s ease;
		}

		.search-input:focus-visible {
			border: 1px solid var(--primary-color);
		}

		.search-input::placeholder {
			color: #999;
		}


		.dark-theme .search-input {
			color: #eee;
		}

		.dark-theme .search-input::placeholder {
			color: #aaa;
		}

		.dark-theme .search-icon {
			color: #aaa;
		}

		.search-empty-msg {
			width: 100%;
		}

		/* summary 内操作按钮行（新增/删除全部/导出/导入），四按钮等宽 */
		.summary-actions {
			display: flex;
			height: 65px;
			border-bottom: 1px solid var(--border-color);
			transition: all 0.2s ease;
		}

		.dark-theme .summary-actions {
			border-bottom: 1px solid var(--border-color-dark);
		}

		.summary-actions .otherbotton,
		.dark-theme .summary-actions .otherbotton {
			flex: 1;
			width: auto;
			height: 65px;
			border-right: none;
			/*border-bottom: none;*/
		}

		.summary-actions .otherbotton+.otherbotton {
			border-left: 1px solid var(--border-color);
		}

		.dark-theme .summary-actions .otherbotton+.otherbotton {
			border-left: 1px solid var(--border-color-dark);
		}

		.createbotton {
			height: 65px;
			width: 65px;
			font-size: 18px;
			padding: 5px 5px;
			background-color: #ffffff;
			color: var(--primary-color-grey);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			text-align: center;
			border-right: 1px solid var(--border-color);
			border-bottom: 1px solid var(--border-color);
			border-left: none;
			border-top: none;
			-webkit-tap-highlight-color: transparent;
			outline: none;
			text-decoration: none;
			flex-shrink: 0;
			cursor: pointer;
			transition: all 0.2s ease;
		}

		.dark-theme .createbotton {
			background-color: #252525;
			color: var(--primary-color-grey);
			border-right: 1px solid var(--border-color-dark);
			border-bottom: 1px solid var(--border-color-dark);
		}

		.createbotton:hover {
			background-color: #f5f5f5;

		}

		.dark-theme .createbotton:hover {
			background-color: #303030;
		}

		.otherbotton {
			height: 65px;
			width: 65px;
			font-size: 18px;
			padding: 5px 5px;
			background-color: #ffffff;
			color: var(--primary-color-grey);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			text-align: center;
			border-right: 1px solid var(--border-color);
			border-bottom: 1px solid var(--border-color);
			border-left: none;
			border-top: none;
			-webkit-tap-highlight-color: transparent;
			outline: none;
			text-decoration: none;
			flex-shrink: 0;
			cursor: pointer;
			transition: all 0.2s ease;
		}

		.dark-theme .otherbotton {
			color: var(--primary-color-grey);
			background-color: #252525;
			border-right: 1px solid var(--border-color-dark);
			border-bottom: 1px solid var(--border-color-dark);
		}

		.otherbotton:hover {
			background-color: #f5f5f5;

		}

		.dark-theme .otherbotton:hover {
			background-color: #303030;
		}

		.otherbotton.disabled {
			color: var(--primary-color-grey-disabled);
			cursor: not-allowed;
		}

		.dark-theme .otherbotton.disabled {
			color: var(--primary-color-grey-disabled);
		}

		.styleShowStorage {
			box-shadow: inset 3px 0 0 var(--primary-color);
			background-color: #f5f5f5;
			color: var(--primary-color)
		}

		.dark-theme .styleShowStorage {
			box-shadow: inset 3px 0 0 var(--primary-color);
			background-color: #303030;
			color: var(--primary-color)
		}

		/* 自定义弹窗样式 */
		.md-btn {
			display: inline-block;
			position: relative;
			font-size: 13px;
			padding: 10px 15px;
			margin-top: 7px;
			margin-right: 5px;
			background: var(--primary-color);
			border-radius: 25px;
			cursor: pointer;
			align-items: center;
			justify-content: center;
			text-align: center;
			-webkit-tap-highlight-color: transparent;
			outline: none;
			border: none;
			transition: all 0.3s ease;
		}

		.md-btn:hover {
			border-radius: 12px;
		}

		.md-btn:active {
			transform: scale(0.9);
		}

		.md-btn p {
			display: inline-block;
			font-size: 13px;
			color: #ffffff;
		}

		.dark-theme .md-btn p {
			font-size: 13px;
			color: #5a2230;
		}

		.md-btn svg {
			display: inline-block;
			height: 13px;
			width: 13px;
			margin-right: 3px;
			color: #ffffff;
			transform: scale(1.2) translateY(1px);
		}

		.dark-theme .md-btn svg {
			color: #5a2230;
		}

		.md-btn-second {
			background: none;
			color: var(--primary-color);
			border: 1px #888 solid;
			transition: all 0.3s ease;
		}

		.md-btn-second p {
			display: inline-block;
			font-size: 13px;
			color: var(--primary-color);
		}

		.dark-theme .md-btn-second p {
			color: var(--primary-color);
		}

		.md-btn-second svg {
			display: inline-block;
			height: 13px;
			width: 13px;
			margin-right: 3px;
			color: var(--primary-color);
			transform: scale(1.2) translateY(1px);
		}

		.dark-theme .md-btn-second svg {
			color: var(--primary-color);
		}

		.shortcutmodal {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.2);
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 1001;
			opacity: 0;
			visibility: hidden;
			transition: all 0.2s ease;
		}

		}

		.modal-actions {

			justify-content: flex-end;

		}

			word-break: break-word;

			flex: 1 1 auto;
			min-height: 0;
			overflow-y: auto;
		}

		/* 标题与按钮区不随消息区压缩 */

		/* 详情表格 */

		.detail-table th {

		.detail-table tr:nth-child(even) td {

		.dark-theme .detail-table tr:nth-child(even) td {

		.detail-table tr:hover td {

		.dark-theme .detail-table tr:hover td {

		.editable-input {

		}

		.editable-input:hover {

		}

		.editable-select {
			min-height: calc(100% + 20px);

		.editable-textarea {

		.section-title-input {

			word-break: break-word;

		.dark-theme .value-cell-textarea {

		/* 二进制记录预览 */

			display: block;

		.binary-info {
			color: #333;
			font-size: 13px;
			word-break: break-all;
			transition: all 0.2s ease;
		}

		.dark-theme .binary-info {
			color: #eee;
		}

		.binary-download-btn {
			border: none;
			appearance: none;
			cursor: pointer;
			padding: 6px 12px;
			font-size: 13px;
			font-family: inherit;

		/* 行内操作按钮 */

			transition: all 0.2s ease;

		.inline-action-btn-p {

			align-items: center;
			gap: 4px;

			width: auto;

		.inline-action-btn-p p {
			font-size: 13px;

		.inline-action-btn:hover {
			background-color: #f5f5f5;

		}

		.inline-action-btn.active {
			background-color: #f2f2f2;
			color: var(--primary-color);

		.dark-theme .inline-action-btn {
			color: #ccc;

		.dark-theme .inline-action-btn:hover {
			background-color: #353535;

		.dark-theme .inline-action-btn.active {

		.inline-action-btn svg {

		.dark-theme .inline-action-btn.danger:hover {

		/* editorHeader 操作按钮 */

		}

		/* 记录表格 */
		.records-table {

			margin-top: 8px;
			border: 1px solid var(--border-color);

			overflow: hidden;
			transition: all 0.2s ease;

		.dark-theme .records-table {
			border-color: var(--border-color-dark);

			background-color: #f5f5f5;
			font-weight: 600;
			color: #555;
		}

		.dark-theme .records-table th {

			color: var(--primary-color);
			font-size: 14px;
			cursor: pointer;

		}

		/* 索引编辑器：单列索引项卡片，名称行 + 可展开的详情区 */
		.index-items {

			display: grid;
			grid-template-columns: minmax(0, 1fr);
			gap: 8px;
			margin-bottom: 8px;

		.index-item {
			min-width: 0;

			overflow-x: auto;
		}

		.index-item-body .detail-table {
			margin-bottom: 0;

			min-width: 300px;

			gap: 0px;

			transition: opacity 0.2s ease;

		.storage-item-actions:has(.inline-action-btn:focus-visible) {

		}

		@media (hover: none) {
			.storage-item-actions {
				opacity: 1;
			}

		@media (max-width: 900px) {

				padding: 12px 10px;

			}

				font-size: 15px;
			}

			.summary-label {
				font-size: 15px;
			}

			.summary-value {
				font-size: 15px;
			}

			.storage-detail-title {
				font-size: 16px;
			}

			.detail-table th {
				font-size: 14px;
				width: 142px;
				min-width: 142px;
				padding: 10px 9px;
			}

			.detail-table td {
				padding: 10px 9px;
			}

			.editable-input {
				width: calc(100% + 18px);
				margin: -10px -9px;
				padding: 10px 9px;
			}

			.editable-textarea {
				min-height: 120px;
				margin: -10px -9px -14px -9px;
				padding: 10px 9px;
			}

			.editable-select {
				min-height: calc(100% + 18px);
			}

		/* 移动端返回按钮：PC 端隐藏。
		   必须用 .action-btn.mobile-back-btn 双类选择器，否则会被后面的 .action-btn { display: inline-flex } 覆盖 */
		.action-btn.mobile-back-btn {
			display: none;
		}

		/* 移动端（≤700px）：布局与 PC 完全一致；默认只显示左侧栏与列表，
		   打开编辑器时隐藏左侧栏与列表，编辑器独占全屏（由 body.editor-open 控制） */
		@media (max-width: 700px) {

			.storage-type-list,
			.dark-theme .storage-type-list {
				border-right: none;
			}

			.summary-item {
				font-size: 14px;
			}

			.storage-item-actions {
				opacity: 1;
			}

			.editor {
				display: none;
			}

			.editor-header {
				padding: 15px 10px;
			}

			body.editor-open .editor {
				display: flex;
			}

			body.editor-open .leftbar,
			body.editor-open .storage-type-list {
				display: none;
			}

			.action-btn.mobile-back-btn {
				display: inline-flex;
			}

			/* 列表扩展到占满 leftbar 右侧的全部宽度 */
			.storage-type-list {
				width: auto;
				flex: 1;
				min-width: 0;
			}
		}
	</style>

	<script>

		/**
		 * Momotan PopUp v2（自定义弹窗组件）
		 * 劫持原生 window.alert / window.confirm
		 * 特性：
		 * 自动创建所需 DOM（如果页面中不存在）
		 * 支持消息中的 \n 换行
		 * 键盘适配：alert(ESC/Enter/Space关闭)，confirm(ESC取消，Enter/Space确认)
		 * 背景点击关闭
		 * 注：需要带上css样式，或者自行定义样式
		 */
		(function initCustomDialog() {
			'use strict';

			// 防止重复初始化
			if (window.__customDialogInited) return;
			window.__customDialogInited = true;

			let currentAlertResolve = null;
			let currentConfirmResolve = null;
			let keydownHandler = null;

			// 弹窗打开时压入一条历史记录，使用户可通过浏览器返回键 / 移动端侧滑手势关闭弹窗
			let pushedHistoryForModal = false;

			function pushModalHistory() {
				try {
					history.pushState({ __momotanModal: true }, '');
					pushedHistoryForModal = true;
				} catch (e) {
					pushedHistoryForModal = false;
				}
			}

			function popModalHistory() {
				if (!pushedHistoryForModal) return;
				pushedHistoryForModal = false;
				// 标记本次 back 由弹窗正常关闭主动触发（而非用户按返回键），
				// 其他 popstate 监听（如移动端编辑器）应跳过，避免弹窗关闭连带退出编辑器
				window.__momotanSelfPop = true;
				setTimeout(function () { window.__momotanSelfPop = false; }, 500);
				try { history.back(); } catch (e) { }
			}

			const ESCAPE_KEY = 'Escape';
			const ENTER_KEY = 'Enter';
			const SPACE_KEY = ' ';

			function ensureDOM() {
				if (!document.body) {
					console.error('CustomDialog: document.body is not available. Please initialize after DOM is ready.');
					return;
				}
				if (!document.getElementById('customAlert')) {
					createAlertDOM();
				}
				if (!document.getElementById('customConfirmModal')) {
					createConfirmDOM();
				}
			}

			function createAlertDOM() {
				const div = document.createElement('div');
				div.id = 'customAlert';
				div.className = 'shortcutmodal';
				div.innerHTML = `
		            <div class="shortcutmodal-content custom-modal-content" role="dialog" aria-modal="true" aria-label="提示">
		                <h3 class="shortcutmodal-title">
		                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		                        <circle cx="12" cy="12" r="10"></circle>
		                        <line x1="12" y1="8" x2="12" y2="12"></line>
		                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
		                    </svg>
		                    <p>提示</p>
		                </h3>
		                <p id="alertMessage"></p>
		                <div class="modal-actions">
		                    <button id="alertConfirm" class="md-btn" style="margin-top:25px;">
		                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		                            <polyline points="20 6 9 17 4 12"></polyline>
		                        </svg>
		                        <p>确定</p>
		                    </button>
		                </div>
		            </div>
		        `;
				document.body.appendChild(div);
			}

			function createConfirmDOM() {
				const div = document.createElement('div');
				div.id = 'customConfirmModal';
				div.className = 'shortcutmodal';
				div.innerHTML = `
		            <div class="shortcutmodal-content custom-modal-content" role="dialog" aria-modal="true" aria-label="确认">
		                <h3 class="shortcutmodal-title">
		                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		                        <circle cx="12" cy="12" r="10"></circle>
		                        <line x1="12" y1="8" x2="12" y2="12"></line>
		                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
		                    </svg>
		                    <p>提示</p>
		                </h3>
		                <p id="confirmMessage"></p>
		                <div class="modal-actions">
		                    <button id="confirmCancelBtn" class="md-btn" style="margin-top:25px;">
		                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		                            <line x1="5" y1="5" x2="19" y2="19"/>
		                            <line x1="5" y1="19" x2="19" y2="5"/>
		                        </svg>
		                        <p>取消</p>
		                    </button>
		                    <button id="confirmThirdBtn" class="md-btn md-btn-second" style="margin-top:25px; display:none;">
								<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40" vertical-align="middle"><g fill="none" fill-rule="evenodd"><path d="M24 0v24H0V0zM12.593 23.258l-.011.002l-.071.035l-.02.004l-.014-.004l-.071-.035c-.01-.004-.019-.001-.024.005l-.004.01l-.017.428l.005.02l.01.013l.104.074l.015.004l.012-.004l.104-.074l.012-.016l.004-.017l-.017-.427c-.002-.01-.009-.017-.017-.018m.265-.113l-.013.002l-.185.093l-.01.01l-.003.011l.018.43l.005.012l.008.007l.201.093c.012.004.023 0 .029-.008l.004-.014l-.034-.614c-.003-.012-.01-.02-.02-.022m-.715.002a.023.023 0 0 0-.027.006l-.006.014l-.034.614c0 .012.007.02.017.024l.015-.002l.201-.093l.01-.008l.004-.011l.017-.43l-.003-.012l-.01-.01z"/><path fill="currentColor" d="M3.076 5.617A1 1 0 0 1 4 5h10a7 7 0 1 1 0 14H5a1 1 0 1 1 0-2h9a5 5 0 1 0 0-10H6.414l1.793 1.793a1 1 0 0 1-1.414 1.414l-3.5-3.5a1 1 0 0 1-.217-1.09"/></g></svg>
		                        <p>放弃</p>
		                    </button>
		                    <button id="confirmOkBtn" class="md-btn md-btn-second" style="margin-top:25px;">
		                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		                            <polyline points="20 6 9 17 4 12"></polyline>
		                        </svg>
		                        <p>确定</p>
		                    </button>
		                </div>
		            </div>
		        `;
				document.body.appendChild(div);
			}

			function bindKeyboard(type, resolve) {
				unbindKeyboard();
				keydownHandler = (e) => {
					// 焦点陷阱：Tab / Shift+Tab 在当前打开的弹窗按钮间循环，不落到弹窗之外
					if (e.key === 'Tab') {
						const modal = document.querySelector('.shortcutmodal.active');
						if (!modal) return;
						const focusables = Array.from(modal.querySelectorAll('button'))
							.filter(b => b.style.display !== 'none' && !b.disabled);
						if (!focusables.length) return;
						e.preventDefault();
						const idx = focusables.indexOf(document.activeElement);
						const next = e.shiftKey
							? (idx <= 0 ? focusables[focusables.length - 1] : focusables[idx - 1])
							: (idx === focusables.length - 1 ? focusables[0] : focusables[idx + 1]);
						next.focus();
						return;
					}
					if (type === 'alert') {
						if (e.key === ESCAPE_KEY || e.key === ENTER_KEY || e.key === SPACE_KEY) {
							e.preventDefault();
							resolve();
							closeAlert();
						}
					} else if (type === 'confirm') {
						if (e.key === ESCAPE_KEY) {
							e.preventDefault();
							resolve(false);
							closeConfirm();
						} else if (e.key === ENTER_KEY || e.key === SPACE_KEY) {
							e.preventDefault();
							resolve(true);
							closeConfirm();
						}
					}
				};
				document.addEventListener('keydown', keydownHandler);
			}

			function unbindKeyboard() {
				if (keydownHandler) {
					document.removeEventListener('keydown', keydownHandler);
					keydownHandler = null;
				}
			}

			function closeAlert() {
				const customAlert = document.getElementById('customAlert');
				if (customAlert) customAlert.classList.remove('active');
				currentAlertResolve = null;
				unbindKeyboard();
				popModalHistory();
			}

			function closeConfirm() {
				const customConfirmModal = document.getElementById('customConfirmModal');
				if (customConfirmModal) customConfirmModal.classList.remove('active');
				currentConfirmResolve = null;
				unbindKeyboard();
				popModalHistory();
			}

			function showAlert(message) {
				return new Promise((resolve) => {
					ensureDOM();
					currentAlertResolve = resolve;

					const customAlert = document.getElementById('customAlert');
					const alertMessage = document.getElementById('alertMessage');
					const alertConfirm = document.getElementById('alertConfirm');

					alertMessage.textContent = message;
					// 强制回流：弹窗 DOM 为惰性创建，先让浏览器计算初始（非 active）样式，
					// 否则首次打开时进入过渡动画不生效
					void customAlert.offsetHeight;
					customAlert.classList.add('active');
					pushModalHistory();
					alertConfirm.focus();

					alertConfirm.onclick = () => {
						resolve();
						closeAlert();
					};

					bindKeyboard('alert', resolve);
				});
			}

			function showConfirm(message) {
				return new Promise((resolve) => {
					ensureDOM();
					currentConfirmResolve = resolve;

					const customConfirmModal = document.getElementById('customConfirmModal');
					const confirmMessage = document.getElementById('confirmMessage');
					const confirmOkBtn = document.getElementById('confirmOkBtn');
					const confirmCancelBtn = document.getElementById('confirmCancelBtn');
					const confirmThirdBtn = document.getElementById('confirmThirdBtn');

					confirmMessage.textContent = message;
					// 复位三选模式留下的按钮状态（第三按钮、文字、主次样式）
					if (confirmThirdBtn) confirmThirdBtn.style.display = 'none';
					confirmOkBtn.querySelector('p').textContent = '确定';
					confirmCancelBtn.querySelector('p').textContent = '取消';
					confirmOkBtn.classList.add('md-btn-second');
					confirmCancelBtn.classList.remove('md-btn-second');
					// 强制回流：弹窗 DOM 为惰性创建，先让浏览器计算初始（非 active）样式，
					// 否则首次打开时进入过渡动画不生效
					void customConfirmModal.offsetHeight;
					customConfirmModal.classList.add('active');
					pushModalHistory();
					confirmOkBtn.focus();

					confirmOkBtn.onclick = () => {
						resolve(true);
						closeConfirm();
					};

					confirmCancelBtn.onclick = () => {
						resolve(false);
						closeConfirm();
					};

					bindKeyboard('confirm', resolve);
				});
			}

			// 三选确认框：返回 'ok' / 'third' / 'cancel'
			// options: { okText, thirdText, cancelText }；键盘 Enter=ok，ESC=cancel，第三项仅点击（防误按）
			function showConfirm3(message, options) {
				const opts = options || {};
				return new Promise((resolve) => {
					ensureDOM();

					const customConfirmModal = document.getElementById('customConfirmModal');
					const confirmMessage = document.getElementById('confirmMessage');
					const confirmOkBtn = document.getElementById('confirmOkBtn');
					const confirmCancelBtn = document.getElementById('confirmCancelBtn');
					const confirmThirdBtn = document.getElementById('confirmThirdBtn');

					confirmMessage.textContent = message;
					confirmOkBtn.querySelector('p').textContent = opts.okText || '确定';
					confirmCancelBtn.querySelector('p').textContent = opts.cancelText || '取消';
					confirmThirdBtn.querySelector('p').textContent = opts.thirdText || '放弃';
					confirmThirdBtn.style.display = '';
					// 三态弹窗专属：确定用实心主按钮，取消/放弃用描边次要按钮（不影响普通二态弹窗）
					confirmOkBtn.classList.remove('md-btn-second');
					confirmCancelBtn.classList.add('md-btn-second');
					// 强制回流：弹窗 DOM 为惰性创建，先让浏览器计算初始（非 active）样式，
					// 否则首次打开时进入过渡动画不生效
					void customConfirmModal.offsetHeight;
					customConfirmModal.classList.add('active');
					pushModalHistory();
					confirmOkBtn.focus();

					// 注意：这里不做按钮状态复位。复位发生在下次打开弹窗时
					// （showConfirm/showConfirm3 入口处），否则“放弃”按钮会在关闭动画期间提前消失
					const done = (r) => {
						resolve(r);
						closeConfirm();
					};

					confirmOkBtn.onclick = () => done('ok');
					confirmCancelBtn.onclick = () => done('cancel');
					confirmThirdBtn.onclick = () => done('third');

					// 复用弹窗的返回键/背景点击处理：均视为 cancel
					currentConfirmResolve = () => done('cancel');
					bindKeyboard('confirm', (v) => done(v ? 'ok' : 'cancel'));
				});
			}

			// 浏览器返回（含移动端侧滑手势）时，若弹窗处于打开状态则关闭弹窗：
			// 历史记录条目已被这次返回消费，故此处仅复位标记，不再调用 history.back()
			window.addEventListener('popstate', function (e) {
				if (currentAlertResolve) {
					e.__momotanHandled = true; // 标记本次返回已被弹窗处理，供其他 popstate 监听（如移动端编辑器）避让
					pushedHistoryForModal = false;
					currentAlertResolve();
					closeAlert();
				} else if (currentConfirmResolve) {
					e.__momotanHandled = true;
					pushedHistoryForModal = false;
					currentConfirmResolve(false);
					closeConfirm();
				}
			});

			// 背景点击关闭
			document.addEventListener('click', function (e) {
				const customAlert = document.getElementById('customAlert');
				const customConfirmModal = document.getElementById('customConfirmModal');

				if (customAlert && e.target === customAlert && currentAlertResolve) {
					currentAlertResolve();
					closeAlert();
				}

				if (customConfirmModal && e.target === customConfirmModal && currentConfirmResolve) {
					currentConfirmResolve(false);
					closeConfirm();
				}
			});

			window.alert = async function (message) {
				await showAlert(message);
			};

			window.confirm = function (message) {
				return showConfirm(message);
			};

			window.confirm3 = function (message, options) {
				return showConfirm3(message, options);
			};
		})();


		// 由SxrDoor添加

		function createBtnSvg(id, num) {
			// 公共部分
			const svgNS = "http://www.w3.org/2000/svg";
			let svg = document.createElementNS(svgNS, "svg");
			svg.setAttribute("xmlns", svgNS);
			svg.setAttribute("viewBox", "0 0 24 24");
			svg.setAttribute("fill", "none");
			svg.setAttribute("stroke", "currentColor");
			svg.setAttribute("stroke-width", "2");
			svg.setAttribute("stroke-linecap", "round");
			svg.setAttribute("stroke-linejoin", "round");

			switch (id) {
				case "localStorageBtn":
					const path = document.createElementNS(svgNS, "path");

		function refreshLeftItems() {
			try {
				// 颜色搞对
				if (document.documentElement.classList.contains('dark-theme')) document.documentElement.style.setProperty('--now-bg-color', '#303030');
				else document.documentElement.style.setProperty('--now-bg-color', 'white');

				// 徽标计数与列表口径一致：排除工具内部键（主题、修改时间元数据，仅 localStorage）
				const countVisibleKeys = (store, storageType) => {
					let n = 0;
					for (let i = 0; i < store.length; i++) {
						if (!storageManager.isInternalKey(store.key(i), storageType)) n++;
					}
					return n;
				};

				// LocalStorage
				createBtnSvg("localStorageBtn", countVisibleKeys(localStorage, 'localStorage'));

				// SessionStorage
				createBtnSvg("sessionStorageBtn", countVisibleKeys(sessionStorage, 'sessionStorage'));

				// IndexDB
				if (window.indexedDB && window.indexedDB.databases) {
					indexedDB.databases().then(databases => {
						if (databases.length) createBtnSvg("indexedDBBtn", databases.length);
						else createBtnSvg("indexedDBBtn", 0);
					});
				} else {
					createBtnSvg("indexedDBBtn", 0);
				}

				//CacheStorage
				if ('caches' in window) {
					caches.keys().then(cacheNames => {
						if (cacheNames.length) createBtnSvg("cacheStorageBtn", cacheNames.length);
						else createBtnSvg("cacheStorageBtn", 0);
					});
				} else {
					createBtnSvg("cacheStorageBtn", 0);
				}
			} catch (err) {
				;
			}
		};

		function styleShowStorage(where) {
			document.getElementById("localStorageBtn").classList.remove("styleShowStorage");
			document.getElementById("sessionStorageBtn").classList.remove("styleShowStorage");
			document.getElementById("indexedDBBtn").classList.remove("styleShowStorage");
			document.getElementById("cacheStorageBtn").classList.remove("styleShowStorage");
			const objId = where + "Btn";
			document.getElementById(objId).classList.add("styleShowStorage");
		}

		// 核心
		const storageManager = {
			// 初始化
			init: function () {
				// 事件监听器
				this.setupEventListeners();
				// 初始化主题
				this.initTheme();
				// 初始化图标
				refreshLeftItems();
				// 检查上次离开时的未保存草稿
				this.checkPendingDraft();
			},

			// 事件监听器
			setupEventListeners: function () {
				// 存储类型按钮（切换失败时 showStorage 会中止，高亮由 showStorage 内部设置）
				document.getElementById('localStorageBtn').addEventListener('click', () => { this.showStorage('localStorage'); });
				document.getElementById('sessionStorageBtn').addEventListener('click', () => { this.showStorage('sessionStorage'); });
				document.getElementById('indexedDBBtn').addEventListener('click', () => { this.showStorage('indexedDB'); });
				document.getElementById('cacheStorageBtn').addEventListener('click', () => { this.showStorage('cacheStorage'); });

				// 清除全部按钮
				document.getElementById('clearAllBtn').addEventListener('click', () => {
					const clearAllBtn = document.getElementById('clearAllBtn');
					if (clearAllBtn && clearAllBtn.classList.contains('disabled')) return;
					this.clearAllStorage();
				});

				// 新增/新建按钮
				const addStorageBtn = document.getElementById('addStorageBtn');
				if (addStorageBtn) {
					addStorageBtn.innerHTML = this.newIconSvg;
					addStorageBtn.addEventListener('click', () => {
						if (this.currentStorageType === 'localStorage' || this.currentStorageType === 'sessionStorage') {
							this.createNewItem(this.currentStorageType);
						} else if (this.currentStorageType === 'indexedDB') {
							this.createNewItem('indexedDB');
						}
					});
				}
				this.updateAddButtonState();

				// 导出按钮
				document.getElementById('exportBtn').addEventListener('click', () => {
					const exportBtn = document.getElementById('exportBtn');
					if (exportBtn && exportBtn.classList.contains('disabled')) return;
					this.exportCurrentStorage();
				});

				// 导入按钮
				document.getElementById('importBtn').addEventListener('click', () => {
					const importBtn = document.getElementById('importBtn');
					if (importBtn && importBtn.classList.contains('disabled')) return;
					document.getElementById('importFileInput').click();
				});
				document.getElementById('importFileInput').addEventListener('change', (e) => {
					const file = e.target.files && e.target.files[0];
					e.target.value = '';
					if (file) this.importStorageFile(file);
				});

				// 存储类型说明按钮
				document.getElementById('helpStorageBtn').addEventListener('click', () => {
					const helpStorageBtn = document.getElementById('helpStorageBtn');
					if (helpStorageBtn && helpStorageBtn.classList.contains('disabled')) return;
					this.showStorageHelp();
				});

				// 主题切换（必须包箭头函数绑定 this：
				// 直接传 this.toggleTheme 时 this 指向 DOM 元素，THEME_KEY 读取为 undefined，
				// 会写入名为 "undefined" 的键，主题刷新后丢失）
				document.getElementById('themeToggle').addEventListener('click', () => this.toggleTheme());

				// 关于按钮
				document.getElementById('about').addEventListener('click', () => {
					alert('Momotan Storage Explorer\n网站本地存储管理工具\nCopyright©2026, Aphasia\nv3.2.1 release 2026/10/24\n\n基于 MIT 协议开源 / Licensed under the MIT License.\n开源地址 / Open source address: https://github.com/kvetc/Momotan-Storage-Explorer\n\n操作说明：\nEnter/Space: 确认 / Confirm\nESC: 取消 / Cancel\nCtrl+S: 保存 / Save\nDelete: 删除 / Delete');
				});

				// 搜索栏
				const searchInput = document.getElementById('storageSearchInput');
				searchInput.addEventListener('input', (e) => {
					this.filterStorageItems(e.target.value);
				});

				// editorHeader 保存按钮
				document.getElementById('saveEditorBtn').addEventListener('click', () => {
					this.saveCurrentItem();
				});

				// editorHeader 删除按钮
				document.getElementById('deleteEditorBtn').addEventListener('click', () => {
					if (this.currentSelection) {
						this.confirmDelete(this.currentSelection.type, this.currentSelection.key);
					}
				});

				// 移动端：返回按钮回到主页面
				document.getElementById('mobileBackBtn').addEventListener('click', () => {
					this.closeMobileEditor();
				});

				// 移动端：浏览器返回 / 侧滑返回时关闭全屏编辑器
				//（若弹窗开着，弹窗的历史条目更新近且已标记处理，此处避让）
				window.addEventListener('popstate', (e) => {
					if (e.__momotanHandled) return;
					// 由弹窗正常关闭主动触发的 back 不是用户返回，跳过
					if (window.__momotanSelfPop) { window.__momotanSelfPop = false; return; }
					if (!document.body.classList.contains('editor-open')) return;
					this._editorHistoryPushed = false; // 历史条目已被本次返回消费
					// 同步重压一条编辑器历史记录：无论用户随后在“未保存”提示中选择什么，
					// 栈上始终有一条编辑器条目拦截下一次返回，不会直接退出页面。
					// 编辑器随后正常关闭（保存/放弃）时，popEditorHistory 会消化这条记录。
					this.pushEditorHistory();
					this.closeMobileEditor();
				});

				// 全局快捷键
				document.addEventListener('keydown', (e) => {
					// Ctrl+S 保存
					if ((e.ctrlKey || e.metaKey) && e.key === 's') {
						e.preventDefault();
						if (this.currentSelection) {
							this.saveCurrentItem();
						}
					}
					// Delete 删除当前选中项
					if (e.key === 'Delete' && this.currentSelection && !this.isEditingInput(e.target)) {
						e.preventDefault();
						this.confirmDelete(this.currentSelection.type, this.currentSelection.key);
					}
				});

				// 页面关闭前提示未保存
				window.addEventListener('beforeunload', (e) => {
					if (this.isDirty) {
						e.preventDefault();
						e.returnValue = '';
					}
				});

				// 页面离开时暂存未保存草稿：移动端在无页面交互时连续返回，
				// 浏览器的历史干预会静默跳过脚本压入的条目、beforeunload 提示也被激活门控拦截，
				// 保存提示和原生提示都可能不出现——草稿快照是这种路径下的最终兜底
				window.addEventListener('pagehide', () => {
					if (!this.isDirty || !this.currentSelection) return;
					try {
						const snapshot = this.collectDraftSnapshot();
						if (snapshot) localStorage.setItem(this.DRAFT_KEY, JSON.stringify(snapshot));
					} catch (e) {
						// 草稿超出 localStorage 配额：清掉可能残留的旧草稿腾出空间，
						// 写入溢出标记，下次打开时如实告知用户草稿未能保存
						try { localStorage.removeItem(this.DRAFT_KEY); } catch (e2) { }
						try { localStorage.setItem(this.DRAFT_OVERFLOW_KEY, String(Date.now())); } catch (e2) { }
					}
				});

				// IndexedDB 编辑器事件委托（只绑定一次）
				const editorContent = document.getElementById('editorContent');
				if (editorContent) {
					editorContent.addEventListener('click', (e) => this.handleEditorClick(e));
					editorContent.addEventListener('input', (e) => this.handleEditorInput(e));
					editorContent.addEventListener('change', (e) => this.handleEditorInput(e));
				}
			},

			// 判断当前焦点是否在输入控件内
			isEditingInput: function (target) {
				return target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' ||
					target.tagName === 'SELECT' || target.isContentEditable);
			},

			// 搜索过滤存储项
			filterStorageItems: function (searchTerm) {
				const items = document.querySelectorAll('.storage-item');
				const term = searchTerm.toLowerCase().trim();
				let visibleCount = 0;

				items.forEach(item => {
					const titleEl = item.querySelector('.storage-title');
					if (!titleEl) return;

					const title = titleEl.textContent.toLowerCase();
					if (term === '' || title.includes(term)) {
						item.style.display = '';
						visibleCount++;
					} else {
						item.style.display = 'none';
					}
				});

				// 无匹配结果提示
				const storageItemsList = document.getElementById('storageItemsList');
				let emptyMsg = storageItemsList.querySelector('.search-empty-msg');

				if (visibleCount === 0 && items.length > 0) {
					if (!emptyMsg) {
						emptyMsg = document.createElement('div');
						emptyMsg.className = 'placeholder2 search-empty-msg';
						emptyMsg.textContent = '没有匹配的存储项';
						storageItemsList.appendChild(emptyMsg);
					}
				} else if (emptyMsg) {
					emptyMsg.remove();
				}
			},

			// 初始化主题（主题类挂在 <html> 上，head 内联脚本已在首次渲染前设置，此处仅兜底同步）
			initTheme: function () {
				const savedTheme = localStorage.getItem(this.THEME_KEY);
				if (savedTheme === 'dark') {
					document.documentElement.classList.add('dark-theme');
				} else {
					document.documentElement.classList.remove('dark-theme');
				}
			},

			// 切换主题
			toggleTheme: function () {
				document.documentElement.classList.toggle('dark-theme');
				if (document.documentElement.classList.contains('dark-theme')) {
					localStorage.setItem(this.THEME_KEY, 'dark');
					document.documentElement.style.setProperty('--now-bg-color', '#303030');
				} else {
					localStorage.setItem(this.THEME_KEY, 'light');
					document.documentElement.style.setProperty('--now-bg-color', 'white');
				}
			},

			// 显示指定存储类型的内容
			showStorage: async function (storageType) {
				// 清除选择状态；有未保存修改且用户取消时中止整个切换
				if (await this.clearSelection() === false) return;

				// 更新当前存储类型
				this.currentStorageType = storageType;
				// 进入 IndexedDB 标签时强制刷新统计缓存，避免其他标签页的修改一直显示旧值
				if (storageType === 'indexedDB') {
					this._idbStatsCache = Object.create(null);
				}
				document.getElementById('storageTypeLabel').textContent =
					storageType === 'localStorage' ? 'localStorage' :
						storageType === 'sessionStorage' ? 'sessionStorage' :
							storageType === 'indexedDB' ? 'IndexedDB' : 'CacheStorage';
				styleShowStorage(storageType);

				// 清空搜索框
				const searchInput = document.getElementById('storageSearchInput');
				if (searchInput) {
					searchInput.value = '';
				}

				// 加载存储内容
				this.loadStorageItems(storageType);

				// 更新存储空间信息
				this.updateStorageSpaceInfo(storageType);

				// 更新左侧新增按钮状态
				this.updateAddButtonState();
			},

			// 更新左侧按钮状态（新增/删除全部/导出/导入）
			updateAddButtonState: function () {
				const addStorageBtn = document.getElementById('addStorageBtn');
				if (addStorageBtn) {
					addStorageBtn.classList.remove('disabled');
					if (this.currentStorageType === 'localStorage') {
						addStorageBtn.title = '新增 localStorage';
					} else if (this.currentStorageType === 'sessionStorage') {
						addStorageBtn.title = '新增 sessionStorage';
					} else if (this.currentStorageType === 'indexedDB') {
						addStorageBtn.title = '新建 IndexedDB';
					} else {
						// CacheStorage 或未选择时禁用
						addStorageBtn.title = this.currentStorageType === 'cacheStorage' ? 'CacheStorage 不可新建' : '请选择存储类型';
						addStorageBtn.classList.add('disabled');
					}
				}

				const clearAllBtn = document.getElementById('clearAllBtn');
				if (clearAllBtn) {
					clearAllBtn.classList.remove('disabled');
					if (this.currentStorageType) {
						clearAllBtn.title = '删除 (Delete)';
					} else {
						clearAllBtn.title = '请选择存储类型';
						clearAllBtn.classList.add('disabled');
					}
				}

				// 导出/导入：需已选择存储类型；CacheStorage 只读，不支持
				const exportBtn = document.getElementById('exportBtn');
				const importBtn = document.getElementById('importBtn');
				const canTransfer = !!this.currentStorageType && this.currentStorageType !== 'cacheStorage';
				if (exportBtn) {
					exportBtn.classList.toggle('disabled', !canTransfer);
					exportBtn.title = !canTransfer ?
						(this.currentStorageType === 'cacheStorage' ? 'CacheStorage 不支持导出' : '请选择存储类型') :
						(this.currentStorageType === 'indexedDB' ?
							'导出全部 IndexedDB 数据库为 JSON 文件（不含二进制记录）' :
							`导出当前 ${this.currentStorageType} 为 JSON 文件`);
				}
				if (importBtn) {
					importBtn.classList.toggle('disabled', !canTransfer);
					importBtn.title = !canTransfer ?
						(this.currentStorageType === 'cacheStorage' ? 'CacheStorage 不支持导入' : '请选择存储类型') :
						(this.currentStorageType === 'indexedDB' ?
							'从 JSON 文件导入（覆盖同名数据库前会自动备份）' :
							'从 JSON 文件导入');
				}

				const helpStorageBtn = document.getElementById('helpStorageBtn');
				if (helpStorageBtn) {
					const labelMap = { localStorage: 'localStorage', sessionStorage: 'sessionStorage', indexedDB: 'IndexedDB', cacheStorage: 'CacheStorage' };
					// 与其他按钮一致：未选择存储类型时禁用
					helpStorageBtn.classList.toggle('disabled', !this.currentStorageType);
					helpStorageBtn.title = this.currentStorageType ? `关于 ${labelMap[this.currentStorageType]} 的说明` : '请选择存储类型后查看说明';
				}
			},

			// 弹窗介绍当前打开的存储类型的作用、特性与删除后果
			showStorageHelp: function () {
				const helpText = {
					localStorage:
						'localStorage\n' +
						'\n作用：以键值对形式持久保存少量文本数据，常用于网站设置、偏好、登录令牌等。\n' +
						'\n特性：容量通常为 5-10MB；仅支持字符串；同步读写；同源共享；长期保留，除非被主动清除。\n' +
						'\n删除后果：可能导致网站设置丢失、登录状态失效、部分功能异常。',
					sessionStorage:
						'sessionStorage\n' +
						'\n作用：以键值对形式保存当前会话的临时数据，常用于表单草稿、页面状态等。\n' +
						'\n特性：容量通常为 5-10MB；仅支持字符串；仅在当前标签页有效，不同标签页互不影响；关闭标签页即自动清空。\n' +
						'\n删除后果：可能导致当前会话中的网站功能异常，通常刷新或重开标签页后可恢复。',
					indexedDB:
						'IndexedDB\n' +
						'\n作用：存储大量结构化数据，常用于离线数据、大文件、复杂缓存对象等。\n' +
						'\n特性：容量大（通常数百 MB 以上）；支持对象与二进制数据；支持索引查询与事务；异步读写；长期保留。\n' +
						'\n删除后果：可能导致依赖它的网站出现异常，本地数据丢失且难以恢复。\n' +
						'\n编辑限制：值为 JSON 格式（纯文本字符串需用英文双引号包裹）；Date/数组/二进制类型的键只读；含 Date/Map/Set/二进制/循环引用的值只读并保留原值；复合键路径用 JSON 数组表示（如 ["a","b"]）。\n' +
						'\n备份提示：导出为 JSON 时不包含二进制与复杂类型记录，不能作为完整备份。',

							this.addObjectStore();

						}
						if (!section) return;

						setVal('store-original-name', secDraft.storeName);
						setVal('store-key-path', secDraft.keyPath);
						setVal('store-auto-increment', secDraft.autoIncrement);

				const storageItemsList = document.getElementById('storageItemsList');
				storageItemsList.innerHTML = '';

				// 遍历所有存储项
				let renderedCount = 0;
				for (let i = 0; i < store.length; i++) {
					const key = store.key(i);
					if (this.isInternalKey(key, storageType)) continue; // 内部元数据与工具设置不展示
					const value = store.getItem(key);
					renderedCount++;

					// 计算存储大小（按 UTF-16 码元计量，与浏览器口径一致）
					const size = this.localStorageEntrySize(key, value);

					// 创建存储项元素
					const storageItem = document.createElement('div');
					storageItem.className = 'storage-item';
					storageItem.dataset.key = key;
					storageItem.dataset.type = storageType;

					storageItem.innerHTML = `
                        <div class="storage-title">${this.escapeHtml(key)}</div>
                        <div class="storage-size">${this.formatBytes(size)}</div>
                        <div class="storage-item-actions">
                            <button class="inline-action-btn danger" title="删除" data-action="delete">${this.deleteIconSvg}</button>
                        </div>
                    `;

					// 点击事件（选中/编辑）
					storageItem.addEventListener('click', (e) => {
						if (!this.isActionButton(e.target)) {
							this.selectStorageItem(storageType, key, value);
						}
					});

					// 删除按钮
					storageItem.querySelector('[data-action="delete"]').addEventListener('click', (e) => {
						e.stopPropagation();
						this.confirmDelete(storageType, key);
					});

					storageItemsList.appendChild(storageItem);
				}

				if (renderedCount === 0) {
					storageItemsList.innerHTML = `<div class="placeholder2">${storageType}为空</div>`;
				}

				// 应用当前搜索过滤
				const searchInput = document.getElementById('storageSearchInput');
				this.filterStorageItems(searchInput ? searchInput.value : '');
				return Promise.resolve();
			},

			// 加载IndexedDB
			loadIndexedDBItems: function (loadToken) {
				const storageItemsList = document.getElementById('storageItemsList');
				storageItemsList.innerHTML = '<div class="placeholder2">IndexedDB数据库列表加载中...</div>';

				// 获取所有IndexedDB数据库
				if (window.indexedDB && window.indexedDB.databases) {
					return indexedDB.databases().then(databases => {
						if (loadToken !== this._loadToken) return; // 已切换到其他类型，丢弃过期结果
						storageItemsList.innerHTML = '';

						if (databases.length === 0) {
							storageItemsList.innerHTML = '<div class="placeholder2">未找到IndexedDB数据库</div>';
						}

						databases.forEach(dbInfo => {
							const storageItem = document.createElement('div');
							storageItem.className = 'storage-item';
							storageItem.dataset.name = dbInfo.name;
							storageItem.dataset.type = 'indexedDB';

							this.getDatabaseStats(dbInfo.name).then(stats => {
								if (loadToken !== this._loadToken) return; // 过期结果不写入列表
								storageItem.innerHTML = `
									<div class="storage-title">${this.escapeHtml(dbInfo.name)}</div>
									<div class="storage-size">${this.formatBytes(stats.size)}</div>
									<div class="storage-size">${stats.count} 条记录</div>
									<div class="storage-time">版本: ${dbInfo.version}</div>
									<div class="storage-item-actions">
										<button class="inline-action-btn danger" title="删除" data-action="delete">${this.deleteIconSvg}</button>
									</div>
								`;

								storageItem.querySelector('[data-action="delete"]').addEventListener('click', (e) => {
									e.stopPropagation();
									this.confirmDelete('indexedDB', dbInfo.name);
								});

								// 应用当前搜索过滤
								const searchInput = document.getElementById('storageSearchInput');
								this.filterStorageItems(searchInput ? searchInput.value : '');
							});

							// 点击事件
							storageItem.addEventListener('click', (e) => {
								if (!this.isActionButton(e.target)) {
									this.selectStorageItem('indexedDB', dbInfo.name, dbInfo);
								}
							});

							storageItemsList.appendChild(storageItem);
						});

						// 应用当前搜索过滤
						const searchInput = document.getElementById('storageSearchInput');
						this.filterStorageItems(searchInput ? searchInput.value : '');
					}).catch(error => {
						if (loadToken !== this._loadToken) return;
						storageItemsList.innerHTML = `<div class="placeholder2">获取数据库列表失败: ${this.escapeHtml(error.message)}</div>`;
					});
				} else {
					storageItemsList.innerHTML = '<div class="placeholder2">您的浏览器不支持IndexedDB数据库枚举</div>';
					return Promise.resolve();
				}
			},

			// 加载CacheStorage
			loadCacheStorageItems: function (loadToken) {
				const storageItemsList = document.getElementById('storageItemsList');
				storageItemsList.innerHTML = '<div class="placeholder2">缓存列表加载中...</div>';

				// 获取所有CacheStorage
				if ('caches' in window) {
					return caches.keys().then(cacheNames => {
						if (loadToken !== this._loadToken) return; // 已切换到其他类型，丢弃过期结果
						storageItemsList.innerHTML = '';

						if (cacheNames.length === 0) {
							storageItemsList.innerHTML = '<div class="placeholder2">未找到缓存</div>';
							return;
						}

						// 获取每个缓存的详细信息
						const cachePromises = cacheNames.map(cacheName => {
							return caches.open(cacheName).then(cache => {
								return cache.keys().then(requests => {
									return this.calculateCacheSize(cache, requests).then(size => {
										return {
											name: cacheName,
											items: requests.length,
											size: size,
											date: null // CacheStorage API 不暴露缓存创建日期
										};
									});
								});
							});
						});

						Promise.all(cachePromises).then(caches => {
							if (loadToken !== this._loadToken) return; // 过期结果不写入列表
							caches.forEach(cacheInfo => {
								const storageItem = document.createElement('div');
								storageItem.className = 'storage-item';
								storageItem.dataset.name = cacheInfo.name;
								storageItem.dataset.type = 'cacheStorage';

								storageItem.innerHTML = `
									<div class="storage-title">${this.escapeHtml(cacheInfo.name)}</div>
									<div class="storage-size">${this.formatBytes(cacheInfo.size || 0)}</div>
									<div class="storage-size">${cacheInfo.items} 项资源</div>
									<div class="storage-item-actions">
										<button class="inline-action-btn danger" title="删除" data-action="delete">${this.deleteIconSvg}</button>
									</div>
								`;

								// 点击事件
								storageItem.addEventListener('click', (e) => {
									if (!this.isActionButton(e.target)) {
										this.selectStorageItem('cacheStorage', cacheInfo.name, cacheInfo);
									}
								});

								// 删除按钮
								storageItem.querySelector('[data-action="delete"]').addEventListener('click', (e) => {
									e.stopPropagation();
									this.confirmDelete('cacheStorage', cacheInfo.name);
								});

								storageItemsList.appendChild(storageItem);
							});

							// 应用当前搜索过滤
							const searchInput = document.getElementById('storageSearchInput');
							this.filterStorageItems(searchInput ? searchInput.value : '');
						}).catch(error => {
							if (loadToken !== this._loadToken) return;
							storageItemsList.innerHTML = `<div class="placeholder2">获取缓存详情失败: ${this.escapeHtml(error.message)}</div>`;
						});
					}).catch(error => {
						if (loadToken !== this._loadToken) return;
						storageItemsList.innerHTML = `<div class="placeholder2">获取缓存列表失败: ${this.escapeHtml(error.message)}</div>`;
					});
				} else {
					storageItemsList.innerHTML = '<div class="placeholder2">您的浏览器不支持CacheStorage</div>';
					return Promise.resolve();
				}
			},

			// 选择存储项
			selectStorageItem: async function (storageType, key, value) {
				// 竞态令牌：快速连续切换时，旧请求返回后不得覆盖新选中的项
				const token = ++this._selectionToken;
				// 切换前检查未保存
				if (this.currentSelection && this.isDirty) {
					const canProceed = await this.confirmDiscardChanges();
					if (!canProceed) return;
				}
				if (token !== this._selectionToken) return;

				// 加载期间先置空：加载失败时 currentSelection 不会残留指向上一项，
				// 避免用户在错误页面上点保存而误保存旧项（保存按钮对此情况为空操作）
				this.currentSelection = null;

				// 清除之前的选择
				const selectedItems = document.querySelectorAll('.storage-item.selected');
				selectedItems.forEach(item => item.classList.remove('selected'));

				// 设置当前选择（遍历比较 dataset，避免键名含引号/反斜杠时选择器语法错误）
				const currentItem = Array.from(document.querySelectorAll('.storage-item')).find(item =>
					item.dataset.key === key || item.dataset.name === key
				);
				if (currentItem) {
					currentItem.classList.add('selected');
				}

				// 更新编辑器标题
				document.getElementById('storageItemTitle').textContent = key;

				// 显示编辑器
				document.getElementById('editorHeader').style.display = 'flex';
				document.getElementById('editorPlaceholder').style.display = 'none';
				document.getElementById('editorContent').style.display = 'block';
				document.getElementById('editorContent').innerHTML = '<div class="placeholder">加载中...</div>';

				this.clearDirty();

				// 移动端：打开编辑器时独占全屏并压入历史记录
				this.openMobileEditor();

				try {
					switch (storageType) {
						case 'localStorage':
						case 'sessionStorage':
							// 进入编辑器时实时读取，避免使用列表渲染时的过期快照
							const itemValue = this.getWebStorage(storageType).getItem(key);
							this.renderWebStorageEditor(storageType, key, itemValue, false);
							break;

						case 'indexedDB':
							const dbInfo = await this.getIndexedDBDetails(key);
							if (token !== this._selectionToken) return; // 过期请求不覆盖新选择
							this.renderIndexedDBEditor(key, dbInfo, false);
							break;

						case 'cacheStorage':
							const cacheInfo = await this.getCacheDetails(key);
							if (token !== this._selectionToken) return; // 过期请求不覆盖新选择
							this.renderCacheStorageEditor(key, cacheInfo);
							break;
					}
				} catch (error) {
					if (token !== this._selectionToken) return; // 过期请求的失败信息也不覆盖新选择
					document.getElementById('editorContent').innerHTML = `<div class="placeholder">获取详细信息失败: ${this.escapeHtml(error.message)}</div>`;
				}
			},

			// 创建新项
			createNewItem: async function (storageType) {
				if (this.isDirty) {
					const canProceed = await this.confirmDiscardChanges();
					if (!canProceed) return;
				}

				// 清除之前的选择
				const selectedItems = document.querySelectorAll('.storage-item.selected');
				selectedItems.forEach(item => item.classList.remove('selected'));

				this.clearDirty();

				let tempKey = '';
				if (storageType === 'localStorage' || storageType === 'sessionStorage') {
					// 生成不与现有键冲突的临时键名
					const store = this.getWebStorage(storageType);
					tempKey = 'new-' + storageType.toLowerCase();
					let n = 2;
					while (store.getItem(tempKey) !== null) {
						tempKey = 'new-' + storageType.toLowerCase() + '-' + n;
						n++;
					}
					this.renderWebStorageEditor(storageType, tempKey, '', true);
				} else if (storageType === 'indexedDB') {
					tempKey = 'new-indexeddb';
					this.renderIndexedDBEditor(tempKey, { name: tempKey, version: 1, objectStores: [] }, true);
				}

				document.getElementById('storageItemTitle').textContent = '[新增] ' + tempKey;
				document.getElementById('editorHeader').style.display = 'flex';
				document.getElementById('editorPlaceholder').style.display = 'none';
				document.getElementById('editorContent').style.display = 'block';

				// 移动端：打开编辑器时独占全屏并压入历史记录
				this.openMobileEditor();
			},

			// 渲染 localStorage / sessionStorage 编辑器
			renderWebStorageEditor: function (storageType, key, value, isNew) {
				this.currentSelection = { type: storageType, key: key, originalKey: isNew ? null : key, isNew: isNew };
				// value 可能为 null（选择期间键被外部删除），按 '' 处理
				const size = this.localStorageEntrySize(key, value);
				const mtime = isNew ? null : this.getMtime(storageType, key);
				const mtimeText = isNew ? '（尚未保存）' :
					(mtime ? new Date(mtime).toLocaleString('zh-CN') : '未知（未经本工具修改或无记录）');

				const html = `
					<div class="detail-section">
						<div class="detail-section-title">基本信息</div>
						<table class="detail-table">
							<tr>
								<th>键名 / Key</th>
								<td><input type="text" class="editable-input" id="localKeyInput" value="${this.escapeAttr(key)}" placeholder="请输入键名"></td>
							</tr>
							<tr>
								<th>键值 / Value</th>
								<td><textarea class="editable-input editable-textarea" id="localValueInput" placeholder="请输入键值">${this.escapeHtml(value)}</textarea></td>
							</tr>
							<tr>
								<th>大小 / Size</th>
								<td>${this.formatBytes(size)}</td>
							</tr>
							<tr>
								<th>修改于 / Modified</th>
								<td>${this.escapeHtml(mtimeText)}</td>
							</tr>
						</table>
					</div>
				`;

				document.getElementById('editorContent').innerHTML = html;

				// 监听变化
				document.getElementById('localKeyInput').addEventListener('input', () => this.markDirty());
				document.getElementById('localValueInput').addEventListener('input', () => this.markDirty());
			},

			// HTML 转义
			escapeHtml: function (text) {
				if (text === null || text === undefined) return '';
				const div = document.createElement('div');
				div.textContent = String(text);
				return div.innerHTML;
			},

			// HTML 属性转义：在文本转义基础上额外转义引号，用于 value="..." / data-*="..." 等属性插值
			escapeAttr: function (text) {
				if (text === null || text === undefined) return '';
				return String(text)
					.replace(/&/g, '&amp;')
					.replace(/</g, '&lt;')
					.replace(/>/g, '&gt;')
					.replace(/"/g, '&quot;')
					.replace(/'/g, '&#39;');
			},

			// 渲染 CacheStorage 编辑器（只读）
			renderCacheStorageEditor: function (cacheName, cacheInfo) {
				this.currentSelection = { type: 'cacheStorage', key: cacheName };

				let resourcesHtml = '';
				if (cacheInfo.resources && cacheInfo.resources.length > 0) {
					const maxItems = Math.min(cacheInfo.resources.length, 100);
					resourcesHtml = `
						<table class="detail-table">
							<tr><!-- <th>#</th> --><th>资源 URL</th></tr>
							${cacheInfo.resources.slice(0, maxItems).map((url, i) => `
								<tr>
									<!-- <td>${i + 1}</td> -->
									<td>${this.escapeHtml(url)}</td>
								</tr>
							`).join('')}
						</table>
						${cacheInfo.resources.length > maxItems ? `<div class="empty-records">还有 ${cacheInfo.resources.length - maxItems} 项资源未显示</div>` : ''}
					`;
				} else {
					resourcesHtml = '<div class="empty-records">该缓存为空</div>';
				}

				const html = `
					<div class="detail-section">
						<div class="detail-section-title">缓存信息</div>
						<table class="detail-table">
							<tr><th>缓存名称</th><td>${this.escapeHtml(cacheName)}</td></tr>
							<tr><th>总大小</th><td>${this.formatBytes(cacheInfo.size)}</td></tr>
							<tr><th>项目数量</th><td>${cacheInfo.items}</td></tr>
						</table>
					</div>
					<div class="detail-section">
						<div class="detail-section-title">已缓存的资源</div>
						${resourcesHtml}
					</div>
				`;

				document.getElementById('editorContent').innerHTML = html;
			},

			// 渲染 IndexedDB 编辑器
			renderIndexedDBEditor: function (dbName, dbInfo, isNew) {
				this.revokeBinaryPreviews();
				this.currentSelection = { type: 'indexedDB', key: dbName, originalName: isNew ? null : dbName, isNew: isNew, dbInfo: dbInfo };

				let objectStoresHtml = '';
				if (dbInfo.objectStores && dbInfo.objectStores.length > 0) {
					objectStoresHtml = dbInfo.objectStores.map((store, index) => {
						const recordsHtml = this.renderRecordsTable(store, index);
						const indexesHtml = this.renderIndexesEditor(store.indexes || []);
						return `
							<div class="detail-section object-store-section" data-store-index="${index}" data-original-name="${this.escapeAttr(store.name)}" data-key-path="${store.keyPath !== null && store.keyPath !== undefined ? this.escapeAttr(JSON.stringify(store.keyPath)) : ''}" data-auto-increment="${store.autoIncrement ? 'true' : 'false'}">
								<div class="detail-section-title">
									对象存储: <input type="text" class="section-title-input" value="${this.escapeAttr(store.name)}" data-field="store-name">
									<button class="inline-action-btn inline-action-btn-p" title="查看/隐藏记录" data-action="toggle-records">${this.expandIconSvg}<p>记录项</p></button>
									<button class="inline-action-btn danger" title="删除对象存储" data-action="delete-store">${this.deleteIconSvg}</button>
								</div>
								<table class="detail-table">
									<tr><th>原始名称</th><td><input type="text" class="editable-input" value="${this.escapeAttr(store.name)}" data-field="store-original-name"></td></tr>
									<tr><th>键路径 / Key Path</th><td><input type="text" class="editable-input" value="${store.keyPath !== null && store.keyPath !== undefined ? this.escapeAttr(Array.isArray(store.keyPath) ? JSON.stringify(store.keyPath) : store.keyPath) : ''}" placeholder="（无），复合键用 JSON 数组如 [&quot;a&quot;,&quot;b&quot;]" data-field="store-key-path"></td></tr>
									<tr><th>自增 / Auto Inc.</th><td>
										<select class="editable-input editable-select" data-field="store-auto-increment">
											<option value="false" ${store.autoIncrement ? '' : 'selected'}>否</option>
											<option value="true" ${store.autoIncrement ? 'selected' : ''}>是</option>
										</select>
									</td></tr>
									<tr><th>索引 / Indexes</th><td class="indexes-cell">${indexesHtml}<button class="add-btn" data-action="add-index">${this.addIconSvg} 新增索引</button></td></tr>
									<tr><th>记录数</th><td data-field="record-count">${store.data ? store.data.length : 0}</td></tr>
								</table>
								<div class="records-container" style="display:none; margin-top:12px;">
									${recordsHtml}
									<button class="add-btn" data-action="add-record">${this.addIconSvg} 新增记录</button>
								</div>
							</div>
						`;
					}).join('');
				} else {
					objectStoresHtml = '<div class="empty-records" id="emptyStoresMsg">该数据库暂无对象存储</div>';
				}

				const dbNameField = isNew
					? `<input type="text" class="editable-input" id="dbNameInput" value="${this.escapeAttr(dbName)}" placeholder="请输入数据库名称">`
					: this.escapeHtml(dbName);

				const html = `
					<div class="detail-section">
						<div class="detail-section-title">数据库信息</div>
						<table class="detail-table">
							<tr><th>数据库名称</th><td>${dbNameField}</td></tr>
							<tr><th>版本 / Version</th><td>${dbInfo.version || 1}</td></tr>
							<tr><th>对象存储数</th><td data-field="object-store-count">${dbInfo.objectStores ? dbInfo.objectStores.length : 0}</td></tr>
							<tr><th>总大小</th><td data-field="total-size">${this.formatBytes(dbInfo.totalSize || 0)}</td></tr>
							<tr><th>总记录数</th><td data-field="total-records">${dbInfo.totalRecords || 0} 条记录</td></tr>
						</table>
					</div>
					<div class="detail-section" id="objectStoresSection">
						<div class="detail-section-title">对象存储列表</div>
						${objectStoresHtml}
						<button class="add-btn" id="addObjectStoreBtn" data-action="add-object-store">${this.addIconSvg} 新增对象存储</button>
					</div>
				`;

				document.getElementById('editorContent').innerHTML = html;

				// 新数据库名称变化
				const dbNameInput = document.getElementById('dbNameInput');
				if (dbNameInput) {
					dbNameInput.addEventListener('input', () => {
						this.markDirty();
						document.getElementById('storageItemTitle').textContent = '（新增）' + dbNameInput.value;
					});
				}
			},

			// 渲染结构化索引编辑器：默认单列只显示索引名称，
			// 点击名称行右侧小箭头展开该索引的键路径/唯一/多值/删除操作（同为单列）
			renderIndexesEditor: function (indexes) {
				if (!indexes.length) return '<div class="empty-records">该对象存储暂无索引</div>';
				return `<div class="index-items">${indexes.map(idx => this.renderIndexRowHtml(idx)).join('')}</div>`;
			},

			// 单个索引项卡片
			renderIndexRowHtml: function (idx) {
				const kpText = idx.keyPath === null || idx.keyPath === undefined ? '' :
					(Array.isArray(idx.keyPath) ? JSON.stringify(idx.keyPath) : idx.keyPath);
				return `
					<div class="index-item" data-index-row="true">
						<div class="index-item-header">
							<input type="text" class="section-title-input" value="${this.escapeAttr(idx.name || '')}" placeholder="索引名" data-field="index-name">
							<button class="inline-action-btn" title="展开/收起详情" data-action="toggle-index">${this.expandIconSvg}</button>
						</div>
						<div class="index-item-body" style="display:none;">
							<table class="detail-table">
								<tr><th>键路径 / Key Path</th><td><input type="text" class="editable-input" value="${this.escapeAttr(kpText)}" placeholder="如 a.b，复合用 [&quot;a&quot;,&quot;b&quot;]" data-field="index-key-path"></td></tr>
								<tr><th>唯一 / Unique</th><td><select class="editable-input editable-select" data-field="index-unique">
									<option value="false" ${idx.unique ? '' : 'selected'}>否</option>
									<option value="true" ${idx.unique ? 'selected' : ''}>是</option>
								</select></td></tr>
								<tr><th>多值 / Multi Entry</th><td><select class="editable-input editable-select" data-field="index-multi-entry">
									<option value="false" ${idx.multiEntry ? '' : 'selected'}>否</option>
									<option value="true" ${idx.multiEntry ? 'selected' : ''}>是</option>
								</select></td></tr>
								<tr><th>操作</th><td><button class="inline-action-btn danger" title="删除索引" data-action="delete-index">${this.deleteIconSvg}</button></td></tr>
							</table>
						</div>
					</div>
				`;
			},

			// 新增索引项（默认展开，方便直接填写）
			addIndexRow: function (storeSection) {
				this.markDirty();

			// 渲染记录表格
			renderRecordsTable: function (store, storeIndex) {
				if (!store.data || store.data.length === 0) {
					return '<div class="empty-records">该对象存储暂无记录</div>';
				}
				if (!this._binaryPreviewUrls) this._binaryPreviewUrls = [];
				const keyColumnEditable = !store.keyPath && !store.autoIncrement;
				// 加载被截断时给出明显警告，提示结构变更可能影响未加载的记录
				const truncatedWarning = (typeof store.records === 'number' && store.records > store.data.length)
					? `<div class="records-truncated-warning">仅加载前 ${store.data.length} 条记录（共 ${store.records} 条），为避免数据丢失，涉及结构变更时请谨慎操作</div>`
					: '';
				return `
					${truncatedWarning}
					<table class="records-table">
						<tr>
							<th class="key-cell">键 / Key</th>
							<th class="value-cell">值 / Value (JSON)</th>
							<th class="action-cell">操作</th>
						</tr>
						${store.data.map((record, recordIndex) => {
					const bin = this.getRecordBinaryInfo(record.value);
					// 只有 string/number 键的 JSON 往返无损，允许文本编辑；
					// Date/数组/二进制键只读显示，保存时沿用内存中的原始键对象
					const keyEditableHere = keyColumnEditable && (typeof record.key === 'string' || typeof record.key === 'number');
					const jsonSafe = bin ? true : this.isJsonSafeValue(record.value);
					// 二进制键 JSON 化后是 {}，显示为占位文本
					const keyDisplay = (record.key instanceof ArrayBuffer || ArrayBuffer.isView(record.key))
						? '[二进制键]' : JSON.stringify(record.key);
					let valueCellHtml;
					let rowAttr = '';
					if (bin) {
						// 二进制记录：显示预览与信息，不提供文本编辑，防止 JSON 化后损坏数据
						rowAttr = ' data-binary="true"';
						const url = URL.createObjectURL(bin.blob);
						const blobIndex = this._binaryPreviewUrls.push(url) - 1;
						let previewHtml = '';
						if (bin.mime.startsWith('image/')) {
							previewHtml = `<img class="binary-preview" src="${url}" alt="">`;
						} else if (bin.mime.startsWith('video/')) {
							previewHtml = `<video class="binary-preview" src="${url}" controls muted playsinline></video>`;
						}
						valueCellHtml = `
									<div class="binary-value-cell">
										${previewHtml}
										<span class="binary-info">[二进制数据] ${this.escapeHtml(bin.mime || '未知类型')} · ${this.formatBytes(bin.size)}（不可直接编辑）</span>
										<button class="binary-download-btn" data-action="download-binary" data-blob-index="${blobIndex}" data-mime="${this.escapeAttr(bin.mime)}">下载</button>
									</div>`;
					} else if (!jsonSafe) {
						// Date/Map/Set/嵌套二进制/循环引用等 JSON 无法无损表达的值：只读，保存时保留原值
						rowAttr = ' data-readonly-value="true"';
						valueCellHtml = `
									<div class="binary-value-cell">
										<span class="binary-info">[复杂类型] 值含 Date/Map/Set/二进制/循环引用等 JSON 无法安全表达的内容（不可直接编辑，保存时保留原值）</span>
									</div>`;
					} else {
						valueCellHtml = `<textarea class="value-cell-textarea" data-field="record-value">${this.escapeHtml(JSON.stringify(record.value, null, 2))}</textarea>`;
					}
					return `
							<tr data-record-index="${recordIndex}" data-original-key="${this.escapeAttr(JSON.stringify(record.key))}"${rowAttr}>
								<td class="key-cell">
									${keyEditableHere ? `<input type="text" class="editable-input" value="${this.escapeAttr(keyDisplay)}" data-field="record-key">` : `<span>${this.escapeHtml(keyDisplay)}</span>`}
								</td>
								<td class="value-cell">
									${valueCellHtml}

								<td class="action-cell">
									<button class="inline-action-btn danger" title="删除记录" data-action="delete-record">${this.deleteIconSvg}</button>

			// IndexedDB 编辑器点击事件委托
			handleEditorClick: function (e) {

				const action = btn.dataset.action;

				} else if (action === 'add-record') {
					e.preventDefault();

					e.preventDefault();
					this.addIndexRow(storeSection);

					e.preventDefault();
					const item = btn.closest('.index-item');

					if (body) {
						const isHidden = body.style.display === 'none';

						btn.classList.toggle('active', isHidden);
					}
				} else if (action === 'delete-index') {
					e.preventDefault();
					this.markDirty();
					const cell = btn.closest('.indexes-cell');
					const item = btn.closest('[data-index-row]');

					e.preventDefault();

					e.preventDefault();
					this.addObjectStore();
				} else if (action === 'download-binary') {
					e.preventDefault();
					// 下载二进制记录
					const url = this._binaryPreviewUrls && this._binaryPreviewUrls[parseInt(btn.dataset.blobIndex, 10)];
					if (!url) return;
					const mime = btn.dataset.mime || '';
					const ext = (mime.split('/')[1] || 'bin').split(';')[0];
					const row = btn.closest('tr');
					let name = 'binary';
					if (row) {

					a.download = `${name}.${ext}`;
					document.body.appendChild(a);
					a.click();
					document.body.removeChild(a);
				}
			},

			handleEditorInput: function (e) {

			// 新增记录

					<td class="value-cell"><textarea class="value-cell-textarea" placeholder='值，例如 {"a":1}' data-field="record-value"></textarea></td>

			// 删除记录行
			deleteRecordRow: function (btn) {
