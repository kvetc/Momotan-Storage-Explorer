				const row = btn.closest('tr');
				row.dataset.deleted = 'true';
				row.style.display = 'none';
			},

			// 估算单条记录占用的字节数（递归处理嵌套在对象/数组中的二进制数据）
			calculateRecordSize: function (value) {
				try {
					if (value === null || value === undefined) return 0;
					if (typeof value === 'string') return new Blob([value]).size;
					if (typeof value === 'number' || typeof value === 'boolean') return 8;
					if (value instanceof Blob) return value.size;
					if (value instanceof ArrayBuffer) return value.byteLength;
					if (ArrayBuffer.isView(value)) return value.byteLength;
					if (Array.isArray(value)) {
						return value.reduce((sum, item) => sum + this.calculateRecordSize(item), 0);
					}
					if (typeof value === 'object') {
						return Object.keys(value).reduce((sum, key) => {
							return sum + new Blob([key]).size + this.calculateRecordSize(value[key]);
						}, 0);
					}
					return new Blob([JSON.stringify(value)]).size;
				} catch (e) {
					return 0;
				}
			},

			// 识别记录值中的二进制内容（ArrayBuffer / TypedArray / Blob，或含 buffer 字段的对象）
			getRecordBinaryInfo: function (value) {
				try {
					if (!value || typeof value !== 'object') return null;
					if (value instanceof Blob) {
						return { blob: value, mime: value.type || '', size: value.size };
					}
					let buffer = null;
					let mime = '';
					if (value instanceof ArrayBuffer) {
						buffer = value;
					} else if (ArrayBuffer.isView(value)) {
						// 视图可能只覆盖底层 buffer 的一部分，必须按 byteOffset/byteLength 切片，
						// 否则预览/下载的会是整个 buffer 而不是视图指向的那几个字节
						buffer = value.buffer.slice(value.byteOffset, value.byteOffset + value.byteLength);
					} else if (value.buffer instanceof ArrayBuffer) {
						buffer = value.buffer;
						mime = typeof value.mime === 'string' ? value.mime : '';
					} else if (ArrayBuffer.isView(value.buffer)) {
						const v = value.buffer;
						buffer = v.buffer.slice(v.byteOffset, v.byteOffset + v.byteLength);
						mime = typeof value.mime === 'string' ? value.mime : '';
					}
					if (!buffer) return null;
					return { blob: new Blob([buffer], { type: mime }), mime, size: buffer.byteLength };
				} catch (e) {
					return null;
				}
			},

			// 释放二进制预览创建的 blob URL
			revokeBinaryPreviews: function () {
				if (this._binaryPreviewUrls && this._binaryPreviewUrls.length) {
					this._binaryPreviewUrls.forEach(u => URL.revokeObjectURL(u));
				}
				this._binaryPreviewUrls = [];
			},

			// 获取IndexedDB详细信息
			getIndexedDBDetails: async function (dbName) {
				return new Promise((resolve, reject) => {
					if (!window.indexedDB || !window.indexedDB.databases) {
						reject(new Error('IndexedDB API不可用'));
						return;
					}

					indexedDB.databases().then(databases => {
						const dbInfo = databases.find(db => db.name === dbName);
						if (!dbInfo) {
							reject(new Error('数据库未找到'));
							return;
						}

						// 尝试打开数据库获取对象存储信息
						const request = indexedDB.open(dbName);
						request.onerror = () => reject(request.error || new Error(`打开数据库 ${dbName} 失败`));
						// 请求无法中途取消，阻塞时提示后继续等待，避免一直“加载中”且无解释
						request.onblocked = () => { alert(`数据库 ${dbName} 正被其他标签页占用，读取将在其关闭后自动继续`); };

						request.onsuccess = (event) => {
							const db = event.target.result;
							const objectStores = [];

							if (db.objectStoreNames.length === 0) {
								db.close();
								resolve({ ...dbInfo, objectStores: [], totalSize: 0, totalRecords: 0, date: new Date() });
								return;
							}

							let pendingStores = db.objectStoreNames.length;

							// 收集对象存储信息
							Array.from(db.objectStoreNames).forEach(storeName => {
								const transaction = db.transaction(storeName, 'readonly');
								const objectStore = transaction.objectStore(storeName);
								// 完整索引元数据（名称/键路径/唯一/多值），供编辑器与重建时保留语义
								const indexes = Array.from(objectStore.indexNames).map(idxName => {
									const idx = objectStore.index(idxName);
									return { name: idx.name, keyPath: idx.keyPath, unique: !!idx.unique, multiEntry: !!idx.multiEntry };
								});

								// 获取对象存储的数据（最多1000条），同时统计总大小和总记录数
								const data = [];
								let storeTotalBytes = 0;
								let storeTotalRecords = 0;
								const cursorRequest = objectStore.openCursor();
								cursorRequest.onsuccess = (e) => {
									const cursor = e.target.result;
									if (cursor) {
										storeTotalRecords++;
										storeTotalBytes += this.calculateRecordSize(cursor.value);
										if (data.length < 1000) {
											data.push({ id: data.length + 1, key: cursor.key, value: cursor.value });
										}
										cursor.continue();
									}
								};
								cursorRequest.onerror = (e) => {
									// 阻止事务因游标失败而中止，在同一（未失败的）事务上回退到 getAll/getAllKeys
									e.preventDefault();
									e.stopPropagation();
									// 清空游标已积累的部分结果，避免与 getAll 结果重复
									data.length = 0;
									storeTotalBytes = 0;
									storeTotalRecords = 0;
									// 点号 keyPath（如 'a.b'）逐段取值；数组 keyPath（复合键）逐段取数组键
									const getKeyByPath = (value) => {
										const kp = objectStore.keyPath;
										if (!kp || value === null || typeof value !== 'object') return undefined;
										const extractOne = (p) => String(p).split('.').reduce((obj, seg) => {
											return (obj !== null && typeof obj === 'object') ? obj[seg] : undefined;
										}, value);
										if (Array.isArray(kp)) {
											const parts = kp.map(extractOne);
											return parts.some(p => p === undefined) ? undefined : parts;
										}
										return extractOne(kp);
									};
									// 限制读取上限，避免大库一次性全部读入内存
									const countRequest = objectStore.count();
									const keysRequest = objectStore.getAllKeys(null, 1000);
									const dataRequest = objectStore.getAll(null, 1000);
									let allKeys = [];
									countRequest.onsuccess = (ce) => {
										storeTotalRecords = ce.target.result || 0;
									};
									keysRequest.onsuccess = (ke) => {
										allKeys = ke.target.result || [];
									};
									dataRequest.onsuccess = (de) => {
										const result = de.target.result || [];
										if (!storeTotalRecords) storeTotalRecords = result.length;
										// 大小仅为已加载部分的估算（兜底路径，游标路径才是精确全量口径）
										storeTotalBytes = result.reduce((sum, value) => sum + this.calculateRecordSize(value), 0);
										result.forEach((value, index) => {
											let key;
											if (objectStore.keyPath && value !== null && typeof value === 'object') {
												// 内联键：从 value 中按 keyPath 提取
												key = getKeyByPath(value);
											} else {
												// out-of-line 键（含 value 为原始类型的情况）：取真实键
												key = allKeys[index];
											}
											data.push({ id: index + 1, key: key, value });
										});
									};
								};

								transaction.onerror = () => {
									db.close();
									reject(transaction.error || new Error(`读取对象存储 ${storeName} 失败`));
								};
								transaction.onabort = () => {
									db.close();
									reject(transaction.error || new Error(`读取对象存储 ${storeName} 被中止`));
								};

								transaction.oncomplete = () => {
									objectStores.push({
										name: storeName,
										indexes: indexes,
										data: data,
										keyPath: objectStore.keyPath,
										autoIncrement: objectStore.autoIncrement,
										size: storeTotalBytes,
										records: storeTotalRecords
									});
									pendingStores--;
									if (pendingStores === 0) {
										db.close();
										resolve({
											...dbInfo,
											objectStores: objectStores,
											totalSize: objectStores.reduce((sum, s) => sum + (s.size || 0), 0),
											totalRecords: objectStores.reduce((sum, s) => sum + (s.records || 0), 0),
											date: new Date()
										});
									}
								};
							});
						};
					}).catch(reject);
				});
			},

			// 获取缓存详细信息
			getCacheDetails: async function (cacheName) {
				try {
					if (!('caches' in window)) {
						throw new Error('CacheStorage API不可用');
					}

					const cache = await caches.open(cacheName);
					const requests = await cache.keys();
					const resources = requests.map(req => req.url);
					const size = await this.calculateCacheSize(cache, requests);

					return {
						name: cacheName,
						items: requests.length,
						resources: resources,
						size: size,
						date: new Date()
					};
				} catch (error) {
					console.error('获取缓存详情失败:', error);
					// 读取失败应如实报错，而不是伪装成“空缓存”
					throw error;
				}
			},

			// 计算缓存大小
			calculateCacheSize: async function (cache, requests) {
				try {
					let totalSize = 0;

					for (const request of requests) {
						const response = await cache.match(request);
						if (response) {
							const blob = await response.blob();
							totalSize += blob.size;
						}
					}

					return totalSize;
				} catch (error) {
					console.error('计算缓存大小失败:', error);
					return 0;
				}
			},



			// 生成并下载 JSON 文件
			downloadJson: function (data, filename) {
				const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
				const url = URL.createObjectURL(blob);
				const a = document.createElement('a');
				a.href = url;
				a.download = filename;
				document.body.appendChild(a);
				a.click();
				document.body.removeChild(a);
				URL.revokeObjectURL(url);
			},

			// 导出文件名：momotan-<类型>-<时间戳>.json
			exportFileName: function (storageType) {
				const now = new Date();
				const pad = (n) => String(n).padStart(2, '0');
				const stamp = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
				return `momotan-${storageType}-${stamp}.json`;
			},

			// 序列化 IndexedDB 键为 JSON 可表示的形式；无法表示（如二进制键）时返回 null
			serializeIdbKey: function (key) {
				if (typeof key === 'number' || typeof key === 'string') {
					return { t: 'plain', v: key };
				}
				if (key instanceof Date) {
					return { t: 'date', v: key.toISOString() };
				}
				if (Array.isArray(key)) {
					const items = key.map(k => this.serializeIdbKey(k));
					if (items.some(i => i === null)) return null;
					return { t: 'array', v: items };
				}
				return null;
			},

			// 反序列化 IndexedDB 键；无法还原时返回 undefined
			deserializeIdbKey: function (s) {
				if (!s || typeof s !== 'object') return undefined;
				if (s.t === 'plain') return s.v;
				if (s.t === 'date') {
					const d = new Date(s.v);
					return Number.isNaN(d.getTime()) ? undefined : d;
				}
				if (s.t === 'array' && Array.isArray(s.v)) {
					const items = s.v.map(i => this.deserializeIdbKey(i));
					// 空数组是合法的 IndexedDB 键，允许还原
					if (items.some(i => i === undefined)) return undefined;
					return items;
				}
				return undefined;
			},

			// 导出当前存储类型为 JSON 文件
			exportCurrentStorage: async function () {
				try {
					const type = this.currentStorageType;
					if (type === 'localStorage' || type === 'sessionStorage') {
						const store = this.getWebStorage(type);
						const items = {};
						for (let i = 0; i < store.length; i++) {
							const key = store.key(i);
							if (this.isInternalKey(key, type)) continue; // 内部元数据与工具设置不导出
							items[key] = store.getItem(key);
						}
						this.downloadJson({
							tool: 'Momotan Storage Explorer',
							version: 1,
							type: type,
							exportedAt: new Date().toISOString(),
							items: items
						}, this.exportFileName(type));
						alert(`已导出 ${Object.keys(items).length} 条 ${type} 记录`);
					} else if (type === 'indexedDB') {
						const result = await this.exportIndexedDBAll();
						this.downloadJson(result.data, this.exportFileName(type));
						let msg = `已导出 ${result.data.databases.length} 个 IndexedDB 数据库`;
						if (result.skippedBinary > 0) msg += `\n${result.skippedBinary} 条包含二进制数据的记录被跳过（JSON 无法表示二进制内容）`;
						if (result.skippedKeys > 0) msg += `\n${result.skippedKeys} 条记录的键或值无法序列化，已跳过`;
						alert(msg);
					}
				} catch (error) {
					console.error('导出失败:', error);
					alert(`导出失败: ${error.message}`);
				}
			},

			// 导出全部 IndexedDB 数据库（结构 + 全量记录，不受编辑器加载上限影响）
			// 格式 v2：包含数据库版本、完整索引元数据（name/keyPath/unique/multiEntry）、数组 keyPath 原貌。
			// 二进制或 JSON 无法无损表达（Date/Map/Set 等）的记录会被跳过并计数——导出不等于完整备份。
			// onlyNames：传入名字数组时只导出这些数据库（用于导入覆盖前的自动备份）
			exportIndexedDBAll: async function (onlyNames) {
				const databases = await indexedDB.databases();
				const out = [];
				let skippedBinary = 0;
				let skippedKeys = 0;
				for (const dbInfo of databases) {
					if (onlyNames && !onlyNames.includes(dbInfo.name)) continue;
					const db = await new Promise((resolve, reject) => {
						const req = indexedDB.open(dbInfo.name);
						req.onsuccess = () => resolve(req.result);
						req.onerror = () => reject(req.error || new Error(`打开数据库 ${dbInfo.name} 失败`));
					});
					const dbData = { name: dbInfo.name, version: db.version, stores: [] };
					for (const storeName of Array.from(db.objectStoreNames)) {
						const storeData = await new Promise((resolve, reject) => {
							const tx = db.transaction(storeName, 'readonly');
							const objectStore = tx.objectStore(storeName);
							const meta = {
								name: storeName,
								keyPath: objectStore.keyPath === undefined ? null : objectStore.keyPath,
								autoIncrement: !!objectStore.autoIncrement,
								// v2：完整索引元数据
								indexes: Array.from(objectStore.indexNames).map(idxName => {
									const idx = objectStore.index(idxName);
									return { name: idx.name, keyPath: idx.keyPath, unique: !!idx.unique, multiEntry: !!idx.multiEntry };
								}),
								records: []
							};
							let keys = [];
							let values = [];
							objectStore.getAllKeys().onsuccess = (e) => { keys = e.target.result || []; };
							objectStore.getAll().onsuccess = (e) => { values = e.target.result || []; };
							tx.oncomplete = () => {
								values.forEach((value, index) => {
									// 含二进制内容的值无法 JSON 化，跳过并计数
									if (this.getRecordBinaryInfo(value)) { skippedBinary++; return; }
									// Date/Map/Set/循环引用等 JSON 无法无损表达的值同样跳过，避免静默变质
									if (!this.isJsonSafeValue(value)) { skippedKeys++; return; }
									const sKey = this.serializeIdbKey(keys[index]);
									if (sKey === null) { skippedKeys++; return; }
									meta.records.push({ key: sKey, value: value });
								});
								resolve(meta);
							};
							tx.onerror = () => reject(tx.error || new Error(`读取对象存储 ${storeName} 失败`));
							tx.onabort = () => reject(tx.error || new Error(`读取对象存储 ${storeName} 被中止`));
						});
						dbData.stores.push(storeData);
					}
					db.close();
					out.push(dbData);
				}
				return {
					data: {
						tool: 'Momotan Storage Explorer',
						version: 2,
						type: 'indexedDB',
						exportedAt: new Date().toISOString(),
						databases: out
					},
					skippedBinary: skippedBinary,
					skippedKeys: skippedKeys
				};
			},

			// 从 JSON 文件导入
			importStorageFile: async function (file) {
				try {
					const text = await file.text();
					const data = JSON.parse(text);
					const type = this.currentStorageType;
					if (!data || data.type !== type) {
						alert(`导入失败：文件类型（${data && data.type ? data.type : '未知'}）与当前存储类型（${type}）不匹配`);
						return;
					}
					if (type === 'localStorage' || type === 'sessionStorage') {
						await this.importWebStorage(type, data);
					} else if (type === 'indexedDB') {
						await this.importIndexedDBData(data);
					}
					this.loadStorageItems(type);
					this.updateStorageSpaceInfo(type);
					refreshLeftItems();
				} catch (error) {
					console.error('导入失败:', error);
					alert(`导入失败: ${error.message}`);
				}
			},

			// 导入 localStorage / sessionStorage（合并写入，同名键覆盖）
			importWebStorage: async function (storageType, data) {
				const items = data.items;
				if (!items || typeof items !== 'object') throw new Error('文件格式不正确：缺少 items 字段');
				const count = Object.keys(items).length;
				if (!await confirm(`即将导入 ${count} 条记录到 ${storageType}，同名键将被覆盖。是否继续？`)) return;
				const store = this.getWebStorage(storageType);
				let imported = 0;
				for (const key of Object.keys(items)) {
					if (this.isInternalKey(key, storageType)) continue; // 内部元数据与工具设置不导入
					store.setItem(key, String(items[key]));
					this.setMtime(storageType, key);
					imported++;
				}
				alert(`已导入 ${imported} 条记录`);
			},

			// 导入 IndexedDB（同名数据库经确认、自动备份后删除重建；兼容 v1/v2 导出格式）
			// 在任何删除/写入之前先完整校验文件结构；每个对象存储的写入独立报告成功/失败，绝不假报成功。
			importIndexedDBData: async function (data) {
				const databases = Array.isArray(data.databases) ? data.databases : [];
				if (databases.length === 0) throw new Error('文件格式不正确：databases 为空');

				// 前置结构校验：文件形状有问题时直接报错，不触碰任何现有数据库
				for (const dbData of databases) {
					if (!dbData || typeof dbData.name !== 'string' || !dbData.name) {
						throw new Error('文件格式不正确：存在无效的数据库条目（缺少 name）');
					}
					if (!Array.isArray(dbData.stores)) {
						throw new Error(`数据库 ${dbData.name} 格式不正确：缺少 stores 数组`);
					}
					for (const s of dbData.stores) {
						if (!s || typeof s.name !== 'string' || !s.name) {
							throw new Error(`数据库 ${dbData.name} 格式不正确：存在无效的对象存储（缺少 name）`);
						}
						if (s.records !== undefined && !Array.isArray(s.records)) {
							throw new Error(`对象存储 ${s.name} 格式不正确：records 不是数组`);
						}
						if (s.indexes !== undefined && !Array.isArray(s.indexes)) {
							throw new Error(`对象存储 ${s.name} 格式不正确：indexes 不是数组`);
						}
					}
				}

				// 逐条校验记录（在删除任何现有数据库之前）：
				// 无 keyPath 的存储，键无法还原/非法的记录必然导入失败；
				// 有 keyPath 的存储，非对象值必然写不进去。直接报错中止，缩小失败窗口
				for (const dbData of databases) {
					for (const s of dbData.stores) {
						if (!Array.isArray(s.records)) continue;
						if (s.keyPath) {
							const bad = s.records.some(rec => !rec || rec.value === null || typeof rec.value !== 'object');
							if (bad) {
								throw new Error(`对象存储 ${s.name} 含 Key Path，但存在非对象类型的记录值，无法导入`);
							}
						} else {
							let invalidKeys = 0;
							for (const rec of s.records) {
								const key = this.deserializeIdbKey(rec && rec.key);
								if (key === undefined || !this.isValidIdbKey(key)) invalidKeys++;
							}
							if (invalidKeys > 0) {
								throw new Error(`对象存储 ${s.name} 中有 ${invalidKeys} 条记录的键无效，无法导入`);
							}
						}
					}
				}

				const existingNames = (await indexedDB.databases()).map(d => d.name);
				const overwriteNames = databases.filter(d => existingNames.includes(d.name)).map(d => d.name);
				let backupFileName = null;
				if (overwriteNames.length > 0) {
					if (!await confirm(`以下数据库已存在，导入将删除并重建：\n${overwriteNames.join('\n')}\n\n将先自动下载这些数据库当前内容的备份（JSON，不含二进制记录），然后继续导入。是否继续？`)) return;
					// 覆盖前自动备份现有库，导入失败时可用备份恢复
					try {
						const backup = await this.exportIndexedDBAll(overwriteNames);
						backupFileName = this.exportFileName('indexedDB-backup');
						this.downloadJson(backup.data, backupFileName);
					} catch (e) {
						if (!await confirm(`自动备份失败（${e.message}）。仍要继续导入吗？现有数据可能被覆盖且无法恢复。`)) return;
					}
				}

				let importedRecords = 0;
				let skippedRecords = 0;
				const storeResults = [];
				for (const dbData of databases) {
					// 删除同名旧库
					if (existingNames.includes(dbData.name)) {
						await new Promise((resolve, reject) => {
							const delReq = indexedDB.deleteDatabase(dbData.name);
							delReq.onsuccess = () => resolve();
							delReq.onerror = () => reject(delReq.error || new Error(`删除数据库 ${dbData.name} 失败`));
							// 请求无法中途取消，阻塞时不谎报失败：提示后继续等待，其他标签页关闭后自动继续
							delReq.onblocked = () => { alert(`数据库 ${dbData.name} 正被其他标签页占用，操作将在其关闭后自动继续`); };
						});
					}
					// 创建结构（对象存储 + 索引），版本号沿用导出值（v2），兼容缺失时取 1
					const targetVersion = Math.max(1, parseInt(dbData.version, 10) || 1);
					try {
						await new Promise((resolve, reject) => {
							const openReq = indexedDB.open(dbData.name, targetVersion);
							openReq.onupgradeneeded = (event) => {
								const db = event.target.result;
								(dbData.stores || []).forEach(storeData => {
									if (!storeData || !storeData.name || db.objectStoreNames.contains(storeData.name)) return;
									const options = {};
									if (storeData.keyPath) options.keyPath = storeData.keyPath;
									if (storeData.autoIncrement) options.autoIncrement = true;
									const objectStore = db.createObjectStore(storeData.name, options);
									(storeData.indexes || []).forEach(idx => {
										if (idx && typeof idx === 'object') {
											// v2：完整索引元数据
											objectStore.createIndex(idx.name, idx.keyPath, { unique: !!idx.unique, multiEntry: !!idx.multiEntry });
										} else {
											// 兼容 v1：索引名即键路径
											objectStore.createIndex(idx, idx);
										}
									});
								});
							};
							openReq.onsuccess = (event) => { event.target.result.close(); resolve(); };
							openReq.onerror = () => reject(openReq.error || new Error(`创建数据库 ${dbData.name} 失败`));
							openReq.onblocked = () => { alert(`数据库 ${dbData.name} 正被其他标签页占用，操作将在其关闭后自动继续`); };
						});
					} catch (e) {
						storeResults.push(`✗ ${dbData.name}：创建结构失败（${e.message}）`);
						continue;
					}
					// 写入记录：每个对象存储独立事务、独立报告，事务失败如实标记
					for (const storeData of (dbData.stores || [])) {
						const records = Array.isArray(storeData.records) ? storeData.records : [];
						if (records.length === 0) continue;
						try {
							const written = await this.importStoreRecords(dbData.name, storeData);
							importedRecords += written.queued;
							skippedRecords += written.skipped;
							let line = `✓ ${dbData.name} / ${storeData.name}：写入 ${written.queued} 条`;
							if (written.skipped > 0) line += `，${written.skipped} 条键无效被跳过`;
							storeResults.push(line);
						} catch (e) {
							storeResults.push(`✗ ${dbData.name} / ${storeData.name}：写入失败（${e.message}），该对象存储的记录未导入`);
						}
					}
				}
				// 导入后统计缓存全部失效
				this._idbStatsCache = Object.create(null);
				const failedCount = storeResults.filter(l => l[0] === '✗').length;
				let msg = failedCount === 0
					? `导入完成：共写入 ${importedRecords} 条记录`
					: `导入部分失败：成功写入 ${importedRecords} 条记录，${failedCount} 个对象存储失败`;
				if (skippedRecords > 0) msg += `\n${skippedRecords} 条记录因键无效或数据不合法被跳过`;
				if (storeResults.length > 0) msg += '\n\n' + storeResults.join('\n');
				if (failedCount > 0 && backupFileName) {
					msg += `\n\n恢复建议：可重新导入刚下载的备份文件 ${backupFileName} 恢复被覆盖的数据库（注意：备份不含二进制与复杂类型记录，这部分无法恢复）`;
				}
				msg += '\n\n注意：导出不包含二进制记录，不能作为完整备份';
				alert(msg);
			},

			// 把一组导入记录写入指定对象存储（单个事务）。
			// 记录数在事务真正提交后才统计；事务失败/中止时 reject，绝不假报成功。
			importStoreRecords: function (dbName, storeData) {
				return new Promise((resolve, reject) => {
					const records = Array.isArray(storeData.records) ? storeData.records : [];
					const openReq = indexedDB.open(dbName);
					openReq.onerror = () => reject(openReq.error || new Error(`打开数据库 ${dbName} 失败`));
					// 请求无法中途取消，阻塞时提示后继续等待
					openReq.onblocked = () => { alert(`数据库 ${dbName} 正被其他标签页占用，导入将在其关闭后自动继续`); };
					openReq.onsuccess = (event) => {
						const db = event.target.result;
						let queued = 0;
						let skipped = 0;
						const tx = db.transaction(storeData.name, 'readwrite');
						const objectStore = tx.objectStore(storeData.name);
						records.forEach(rec => {
							try {
								if (storeData.keyPath) {
									// 键含于值中，不能显式传键
									objectStore.put(rec.value);
									queued++;
								} else {
									const key = this.deserializeIdbKey(rec.key);
									if (key === undefined || !this.isValidIdbKey(key)) { skipped++; return; }
									objectStore.put(rec.value, key);
									queued++;
								}
							} catch (e) { skipped++; }
						});
						tx.oncomplete = () => { db.close(); resolve({ queued, skipped }); };
						tx.onerror = () => { const err = tx.error; db.close(); reject(err || new Error('写入事务失败')); };
						tx.onabort = () => { const err = tx.error; db.close(); reject(err || new Error('写入事务被中止')); };
					};
				});
			},

			// 保存当前项
			saveCurrentItem: async function () {
				if (!this.currentSelection) return;

				try {
					const sel = this.currentSelection;
					if (sel.type === 'localStorage' || sel.type === 'sessionStorage') {
						const saved = await this.saveWebStorage();
						if (saved === false) return; // 用户在覆盖确认中取消
					} else if (sel.type === 'indexedDB') {
						await this.saveIndexedDB();
					} else {
						alert('当前类型不支持保存');
						return;
					}
					this.clearDirty();
					this.clearDraftIfMatches(sel);
					// 保存后重建列表（等待异步类型渲染完成），再恢复滚动位置与选中高亮
					const listEl = document.getElementById('storageItemsList');
					const scrollTop = listEl ? listEl.scrollTop : 0;
					await this.loadStorageItems(this.currentStorageType);
					this.restoreListSelection(scrollTop);
					// Web Storage 编辑器重渲染，刷新大小/上次修改等显示
					if (sel.type === 'localStorage' || sel.type === 'sessionStorage') {
						this.renderWebStorageEditor(sel.type, sel.key, this.getWebStorage(sel.type).getItem(sel.key), false);
					}
					this.updateStorageSpaceInfo(this.currentStorageType);
					refreshLeftItems();
					alert('保存成功');
				} catch (error) {
					console.error('保存失败:', error);
					alert(`保存失败: ${error.message}`);
				}
			},

			// 保存 localStorage / sessionStorage
			// 不 trim 键名；允许空字符串键（Web Storage 合法）；
			// 先写新键成功后再删旧键，配额失败时旧值不丢；
			// 新增/重命名落到已存在的键时先弹确认。返回 false 表示用户取消。
			saveWebStorage: async function () {
				const storageType = this.currentSelection.type;
				const store = this.getWebStorage(storageType);
				const newKey = document.getElementById('localKeyInput').value;
				const newValue = document.getElementById('localValueInput').value;

				const originalKey = this.currentSelection.originalKey;
				const renamed = originalKey !== null && originalKey !== newKey;
				const creating = originalKey === null;

				// 覆盖保护：新增或重命名落到已存在的键时先确认
				if ((creating || renamed) && store.getItem(newKey) !== null) {
					const ok = await confirm(`键 "${newKey}" 已存在，保存将覆盖其现有值。是否继续？`);
					if (!ok) return false;
				}

				// 先写新键：若此处抛 QuotaExceededError，旧键仍未被动过
				store.setItem(newKey, newValue);
				this.setMtime(storageType, newKey);
				if (renamed) {
					store.removeItem(originalKey);
					this.removeMtime(storageType, originalKey);
				}

				this.currentSelection.key = newKey;
				this.currentSelection.originalKey = newKey;
				this.currentSelection.isNew = false;
				document.getElementById('storageItemTitle').textContent = newKey;
				return true;
			},

			// 解析 JSON 值。普通文本（不像 JSON 的输入）按字符串保存；
			// 形如 JSON 但解析失败（如 {bad}）时抛出带位置说明的错误，避免类型被静默改变。
			// 注意：只有明确的结构化 JSON 起始符 { [ " 解析失败才报错；
			// 数字/true/false/null 要么能解析成功，要么按字符串保存（test/foo/note/3D 不会误判）
			parseJsonValue: function (value, context) {
				if (value === undefined || value === null) return '';
				const trimmed = String(value).trim();
				if (trimmed === '') return '';
				try {
					return JSON.parse(trimmed);
				} catch (e) {
					const looksJson = /^[[{"]/.test(trimmed);
					if (looksJson) {
						throw new Error((context ? context + '：' : '') +
							'JSON 解析失败（' + e.message + '）。如需保存为字符串，请用英文双引号包裹，如 "文本"');
					}
					return value;
				}
			},

			// 解析键路径输入：支持字符串（如 a.b）或 JSON 数组（如 ["a","b"]，复合键），空值返回 null
			parseKeyPathInput: function (text) {
				const t = (text === undefined || text === null) ? '' : String(text).trim();
				if (!t) return null;
				if (t[0] === '[') {
					let arr;
					try { arr = JSON.parse(t); } catch (e) {
						throw new Error('复合键路径格式不正确（' + e.message + '），应为 JSON 字符串数组，如 ["a","b"]');
					}
					if (!Array.isArray(arr) || arr.length === 0 || !arr.every(s => typeof s === 'string' && s.length > 0)) {
						throw new Error('复合键路径必须是非空字符串数组，如 ["a","b"]');
					}
					return arr;
				}
				return t;
			},

			// 比较两个 keyPath（字符串或字符串数组），绝不经过 String() 强转
			keyPathEqual: function (a, b) {

				return JSON.stringify(norm(a)) === JSON.stringify(norm(b));
			},

			// 判断值能否被 JSON 无损表达（不能的保存时必须保留原对象引用，而不是 JSON 化）
			isJsonSafeValue: function (value, seen) {
				if (value === null) return true;
				const t = typeof value;
				if (t === 'string' || t === 'boolean') return true;
				if (t === 'number') return Number.isFinite(value);
				if (t !== 'object') return false; // undefined / function / symbol / bigint
				if (value instanceof Date || value instanceof RegExp || value instanceof Map || value instanceof Set ||
					value instanceof Blob || value instanceof ArrayBuffer || ArrayBuffer.isView(value)) return false;
				seen = seen || [];
				if (seen.indexOf(value) !== -1) return false; // 循环引用
				seen.push(value);
				let safe;
				if (Array.isArray(value)) {
					safe = value.every(item => this.isJsonSafeValue(item, seen));
				} else {
					const proto = Object.getPrototypeOf(value);
					safe = (proto === Object.prototype || proto === null) &&
						Object.keys(value).every(k => this.isJsonSafeValue(value[k], seen));
				}
				seen.pop();
				return safe;
			},

			// 保存 IndexedDB
			// 顺序保证：收集 → 名称校验 → 合并全量记录（只读旧库）→ 预生成全部写计划（纯内存校验）→ 执行写入。
			// 任何校验失败都发生在触碰数据库之前；结构变更与记录写入在同一个 versionchange 事务中完成，失败整体回滚。
			saveIndexedDB: async function () {
				const dbNameInput = document.getElementById('dbNameInput');
				const dbName = dbNameInput ? dbNameInput.value.trim() : this.currentSelection.key;
				const isNew = this.currentSelection.isNew;

				if (!dbName) {
					throw new Error('数据库名称不能为空');
				}
				const dbInfo = this.currentSelection.dbInfo || { version: 1, objectStores: [] };

				// 收集 DOM 中的对象存储状态
				const allSections = document.querySelectorAll('.object-store-section');
				const stores = [];
				const deletedStores = [];

				for (const section of allSections) {
					const isDeleted = section.dataset.deleted === 'true';
					const originalStoreName = section.dataset.originalName || '';
					const isNewStore = section.dataset.isNew === 'true';
					const nameInput = section.querySelector('[data-field="store-name"]');
					const newStoreName = nameInput ? nameInput.value.trim() : '';
					const originalNameInput = section.querySelector('[data-field="store-original-name"]');
					const displayOriginalName = originalNameInput ? originalNameInput.value.trim() : originalStoreName;
					const keyPathInput = section.querySelector('[data-field="store-key-path"]');
					// keyPath 可能是字符串或字符串数组（复合键），统一解析为原始类型
					const keyPath = this.parseKeyPathInput(keyPathInput ? keyPathInput.value : '');
					const autoIncrementInput = section.querySelector('[data-field="store-auto-increment"]');
					const autoIncrement = autoIncrementInput ? autoIncrementInput.value === 'true' : false;

					if (isDeleted) {
						if (!isNewStore && originalStoreName) {
							deletedStores.push(originalStoreName);
						}
						continue;
					}

					if (!newStoreName) {
						throw new Error('对象存储名称不能为空');
					}

					// 收集结构化索引行（名称 + 键路径 + 唯一 + 多值）
					const indexes = [];
					const indexRows = section.querySelectorAll('[data-index-row]');
					for (const irow of indexRows) {
						const nameEl = irow.querySelector('[data-field="index-name"]');
						const kpEl = irow.querySelector('[data-field="index-key-path"]');
						const uniqueEl = irow.querySelector('[data-field="index-unique"]');
						const meEl = irow.querySelector('[data-field="index-multi-entry"]');
						const iname = nameEl ? nameEl.value.trim() : '';
						if (!iname) {
							throw new Error('对象存储 "' + newStoreName + '" 中存在未命名的索引');
						}
						const ikp = this.parseKeyPathInput(kpEl ? kpEl.value : '');
						if (!ikp) {
							throw new Error('对象存储 "' + newStoreName + '" 的索引 "' + iname + '" 缺少键路径');
						}
						indexes.push({
							name: iname,
							keyPath: ikp,
							unique: uniqueEl ? uniqueEl.value === 'true' : false,
							multiEntry: meEl ? meEl.value === 'true' : false
						});
					}
					const indexNames = indexes.map(i => i.name);
					const dupIndexes = indexNames.filter((n, i) => indexNames.indexOf(n) !== i);
					if (dupIndexes.length > 0) {
						throw new Error('对象存储 "' + newStoreName + '" 的索引名称重复: ' + dupIndexes.join(', '));
					}

					// 对比原始对象存储元数据，判断是否需要重建或修改索引
					const originalStore = originalStoreName ? (dbInfo.objectStores || []).find(s => s.name === originalStoreName) : null;

					const records = [];
					const rows = section.querySelectorAll('.records-table tr[data-record-index]:not([data-deleted="true"])');
					for (const row of rows) {
						const keyInput = row.querySelector('[data-field="record-key"]');
						const valueInput = row.querySelector('[data-field="record-value"]');
						const isNewRecord = row.dataset.isNew === 'true';
						const isModified = row.dataset.modified === '1';
						const recordIndex = parseInt(row.dataset.recordIndex, 10);
						const originalRecord = (!isNewRecord && originalStore && originalStore.data && Number.isInteger(recordIndex))
							? originalStore.data[recordIndex] : null;

						// 未修改的已有记录：直接引用内存中的原始键与值，不做 JSON 往返，
						// 避免 Date/Map/Set/嵌套二进制等被静默改坏
						if (originalRecord && !isModified) {
							records.push({
								originalKey: originalRecord.key,
								key: originalRecord.key,
								value: originalRecord.value,
								isNew: false,
								unmodified: true
							});
							continue;
						}

						let recordKey;
						if (keyInput) {
							recordKey = this.parseJsonValue(keyInput.value, '对象存储 "' + newStoreName + '" 的记录键');
						} else {
							// 只读键（Date/数组/二进制）或键含于值中：沿用原始键对象引用
							recordKey = originalRecord ? originalRecord.key : undefined;
						}

						let recordValue;
						if (valueInput) {
							recordValue = this.parseJsonValue(valueInput.value, '对象存储 "' + newStoreName + '" 中键为 ' + JSON.stringify(recordKey) + ' 的记录值');
						} else if (originalRecord) {
							// 二进制/复杂类型只读单元格：回填原始值，防止被 JSON 化损坏
							recordValue = originalRecord.value;
						}

						records.push({
							originalKey: originalRecord ? originalRecord.key : undefined,
							key: recordKey,
							value: recordValue,
							isNew: isNewRecord
						});
					}

					let wasRecreated = false;
					let indexChanged = false;
					if (originalStore) {
						const origAutoIncrement = !!originalStore.autoIncrement;
						const origIndexes = originalStore.indexes || [];
						// keyPath 按类型安全比较（数组与数组比，字符串与字符串比）
						if (!this.keyPathEqual(originalStore.keyPath, keyPath) || origAutoIncrement !== autoIncrement) {
							wasRecreated = true;
						}
						// 索引按完整元数据比较（名称/键路径/唯一/多值），任一不一致才需要增删索引
						const idxMetaEqual = (a, b) => a.name === b.name && this.keyPathEqual(a.keyPath, b.keyPath) &&
							!!a.unique === !!b.unique && !!a.multiEntry === !!b.multiEntry;
						if (origIndexes.length !== indexes.length ||
							!origIndexes.every(o => indexes.some(n => idxMetaEqual(o, n)))) {
							indexChanged = true;
						}
					}

					// 重命名或重建都需要先删除旧对象存储
					if (!isNewStore && originalStoreName && (originalStoreName !== newStoreName || wasRecreated)) {
						if (!deletedStores.includes(originalStoreName)) {
							deletedStores.push(originalStoreName);
						}
					}

					stores.push({
						originalName: originalStoreName,
						displayOriginalName: displayOriginalName,
						newName: newStoreName,
						isNew: isNewStore,
						wasRecreated: wasRecreated,
						indexChanged: indexChanged,
						keyPath: keyPath,
						autoIncrement: autoIncrement,
						indexes: indexes,
						records: records
					});
				}

				// 校验对象存储名称唯一性
				const storeNames = stores.map(s => s.newName);
				const duplicates = storeNames.filter((name, index) => storeNames.indexOf(name) !== index);
				if (duplicates.length > 0) {
					throw new Error(`对象存储名称重复: ${duplicates.join(', ')}`);
				}

				// 新建数据库时检查名称是否已存在
				if (isNew && window.indexedDB && window.indexedDB.databases) {
					const existing = await indexedDB.databases();
					if (existing.some(db => db.name === dbName)) {
						throw new Error(`数据库 "${dbName}" 已存在，请更换名称`);
					}
				}

				const hasStructuralChanges = isNew || deletedStores.length > 0 || stores.some(s =>
					s.isNew || s.wasRecreated || s.indexChanged || s.originalName !== s.newName
				);

				if (hasStructuralChanges && !isNew) {
					// 结构变更会删除旧对象存储并按内存记录重写，而内存中仅加载了前 1000 条。
					// 先在旧存储被删除前读取其全部记录并与编辑结果合并，避免未加载的记录丢失。
					for (const store of stores) {
						const willRewrite = !store.isNew && store.originalName &&
							(store.wasRecreated || store.originalName !== store.newName);
						if (willRewrite) {
							await this.mergeFullStoreRecords(dbName, store, dbInfo);
						}
					}
				}

				// 全量校验：在任何写操作之前为所有对象存储生成写计划，任一校验失败都不会触碰数据库
				const plans = stores.map(store => ({ store: store, ops: this.buildIndexedDBWritePlan(store, dbInfo) }));

				if (hasStructuralChanges) {
					// 结构变更与记录写入在同一个 versionchange 事务中完成，任一步失败整体回滚
					await this.applyIndexedDBUpgrade(dbName, isNew ? 0 : dbInfo.version, deletedStores, stores, plans, dbInfo);
				} else {
					await this.applyIndexedDBRecordChanges(dbName, plans);
				}

				// 使该库的统计缓存失效
				delete this._idbStatsCache[dbName];

				// 更新当前选择状态并刷新右侧详情
				this.currentSelection.key = dbName;
				this.currentSelection.originalName = dbName;
				this.currentSelection.isNew = false;
				this.currentSelection.dbInfo = await this.getIndexedDBDetails(dbName);
				document.getElementById('storageItemTitle').textContent = dbName;
				this.renderIndexedDBEditor(dbName, this.currentSelection.dbInfo, false);
			},

			// 在同一个 versionchange 事务中应用结构变更与记录写入：
			// 删除/重建对象存储、增删索引、写入记录全部在升级事务里完成，
			// 任一步失败 abort() 后整体回滚，数据库保持旧版本原样。
			// plans 必须已在调用前通过 buildIndexedDBWritePlan 完成全量校验。
			applyIndexedDBUpgrade: function (dbName, currentVersion, deletedStores, stores, plans, dbInfo) {
				return new Promise((resolve, reject) => {
					const newVersion = currentVersion > 0 ? currentVersion + 1 : 1;
					const request = indexedDB.open(dbName, newVersion);
					let syncError = null;  // onupgradeneeded 内同步抛出的错误
					let asyncError = null; // 事务内请求级异步错误（如约束冲突）

					request.onerror = () => reject(syncError || asyncError || request.error || new Error(`打开数据库 ${dbName} 失败`));
					// 请求无法中途取消，阻塞时不谎报失败：提示后继续等待，其他标签页关闭后自动继续
					request.onblocked = () => { alert(`数据库 ${dbName} 正被其他标签页占用，操作将在其关闭后自动继续`); };

					request.onupgradeneeded = (event) => {
						const db = event.target.result;
						const tx = event.target.transaction;

						try {
							// 删除对象存储（包含显式删除、重命名、重建）
							deletedStores.forEach(storeName => {
								if (db.objectStoreNames.contains(storeName)) {
									db.deleteObjectStore(storeName);
								}
							});

							// 创建/重建对象存储
							stores.forEach(store => {
								if (store.isNew || store.wasRecreated || (store.originalName && store.originalName !== store.newName)) {
									if (db.objectStoreNames.contains(store.newName)) {
										db.deleteObjectStore(store.newName);
									}
									const options = {};
									if (store.keyPath) options.keyPath = store.keyPath;
									if (store.autoIncrement) options.autoIncrement = true;
									const objectStore = db.createObjectStore(store.newName, options);
									// 按完整元数据创建索引（名称/键路径/唯一/多值）
									(store.indexes || []).forEach(idx => {
										if (!objectStore.indexNames.contains(idx.name)) {
											objectStore.createIndex(idx.name, idx.keyPath, { unique: !!idx.unique, multiEntry: !!idx.multiEntry });
										}
									});
								} else if (store.indexChanged && dbInfo) {
									// 仅索引变化：在原对象存储上增删索引；同名但元数据不同的索引先删后建
									if (db.objectStoreNames.contains(store.newName)) {
										const objectStore = tx.objectStore(store.newName);
										const originalStore = (dbInfo.objectStores || []).find(s => s.name === store.originalName);
										const origIndexes = originalStore ? (originalStore.indexes || []) : [];
										const newIndexes = store.indexes || [];
										origIndexes.forEach(idx => {
											if (!newIndexes.some(n => n.name === idx.name) && objectStore.indexNames.contains(idx.name)) {
												objectStore.deleteIndex(idx.name);
											}
										});
										newIndexes.forEach(idx => {
											const orig = origIndexes.find(o => o.name === idx.name);
											const changed = !orig ||
												!this.keyPathEqual(orig.keyPath, idx.keyPath) ||
												!!orig.unique !== !!idx.unique || !!orig.multiEntry !== !!idx.multiEntry;
											if (changed) {
												if (objectStore.indexNames.contains(idx.name)) {
													objectStore.deleteIndex(idx.name);
												}
												objectStore.createIndex(idx.name, idx.keyPath, { unique: !!idx.unique, multiEntry: !!idx.multiEntry });
											}
										});
									}
								}
							});

							// 记录写入（同一升级事务，versionchange 事务覆盖库内全部对象存储）
							plans.forEach(plan => {
								if (!plan.ops.length || !db.objectStoreNames.contains(plan.store.newName)) return;
								const objectStore = tx.objectStore(plan.store.newName);
								plan.ops.forEach(op => {
									if (op.type === 'delete') {
										objectStore.delete(op.key);
									} else if (op.type === 'add') {
										if (op.key === undefined) objectStore.add(op.value);
										else objectStore.add(op.value, op.key);
									} else if (op.type === 'put') {
										if (op.key === undefined) objectStore.put(op.value);
										else objectStore.put(op.value, op.key);
									}
								});
							});

							// 请求级异步错误（如唯一约束冲突）：记录原因并中止整个升级事务
							tx.onerror = () => {
								asyncError = tx.error || new Error('写入记录失败');
								try { tx.abort(); } catch (e) { }
							};
						} catch (e) {
							syncError = e;
							try { tx.abort(); } catch (e2) { }
						}
					};

					request.onsuccess = (event) => {
						const db = event.target.result;
						db.close();
						resolve();
					};
				});
			},

			// 比较两个 IndexedDB 键是否相等（支持数组/Date/二进制键；类型不可比较时视为不相等）
			idbKeysEqual: function (a, b) {
				if (a === b) return true;
				if (a === undefined || b === undefined) return false;
				try {
					return indexedDB.cmp(a, b) === 0;
				} catch (e) {
					return false;
				}
			},

			// 校验一个值是否为合法的 IndexedDB 键
			isValidIdbKey: function (key) {
				if (typeof key === 'number') return !Number.isNaN(key);
				if (typeof key === 'string') return true;
				if (key instanceof Date) return !Number.isNaN(key.getTime());
				if (key instanceof ArrayBuffer || ArrayBuffer.isView(key)) return true;
				// 数组键逐元素递归校验；空数组按规范也是合法键
				if (Array.isArray(key)) return key.every(item => this.isValidIdbKey(item));
				return false;
			},

			// 读取对象存储的全部记录（不受编辑器 1000 条加载上限影响）
			readAllStoreRecords: function (dbName, storeName) {
				return new Promise((resolve, reject) => {
					const request = indexedDB.open(dbName);
					request.onerror = () => reject(new Error(`打开数据库 ${dbName} 失败`));
					// 请求无法中途取消，阻塞时不谎报失败：提示后继续等待，其他标签页关闭后自动继续
					request.onblocked = () => { alert(`数据库 ${dbName} 正被其他标签页占用，操作将在其关闭后自动继续`); };
					request.onsuccess = (event) => {
						const db = event.target.result;
						if (!db.objectStoreNames.contains(storeName)) {
							db.close();
							reject(new Error(`对象存储 ${storeName} 不存在`));
							return;
						}
						const transaction = db.transaction(storeName, 'readonly');
						const objectStore = transaction.objectStore(storeName);
						let allKeys = [];
						let allValues = [];
						const keysRequest = objectStore.getAllKeys();
						const valuesRequest = objectStore.getAll();
						keysRequest.onsuccess = (e) => { allKeys = e.target.result || []; };
						valuesRequest.onsuccess = (e) => { allValues = e.target.result || []; };
						transaction.oncomplete = () => {
							db.close();
							resolve(allValues.map((value, index) => ({ key: allKeys[index], value: value })));
						};
						transaction.onerror = () => {
							db.close();
							reject(transaction.error || new Error(`读取对象存储 ${storeName} 失败`));
						};
						transaction.onabort = () => {
							db.close();
							reject(transaction.error || new Error(`读取对象存储 ${storeName} 被中止`));
						};
					};
				});
			},

			// 结构变更重写前，用原存储的全量记录与编辑器中的改动合并：
			// 未加载进编辑器（超出 1000 条上限）的记录原样保留，
			// 已加载但被删除的记录丢弃，编辑过/新增的记录以编辑器内容为准。
			mergeFullStoreRecords: async function (dbName, store, dbInfo) {
				const originalStore = (dbInfo.objectStores || []).find(s => s.name === store.originalName);
				if (!originalStore) return;
				// 未发生截断（已加载全部记录）时，编辑器中的记录即为全量，无需合并
				if (originalStore.data && typeof originalStore.records === 'number' &&
					originalStore.data.length >= originalStore.records) return;
				const fullRecords = await this.readAllStoreRecords(dbName, store.originalName);
				const loadedKeys = (originalStore.data || []).map(r => r.key);
				const editedRecords = store.records.filter(r => !r.isNew && r.originalKey !== undefined);
				const newRecords = store.records.filter(r => r.isNew);
				const merged = [];
				fullRecords.forEach(fullRecord => {
					const edited = editedRecords.find(r => this.idbKeysEqual(r.originalKey, fullRecord.key));
					if (edited) {
						merged.push(edited);
						return;
					}
					const wasLoaded = loadedKeys.some(k => this.idbKeysEqual(k, fullRecord.key));
					if (!wasLoaded) {
						// 超出加载上限、未出现在编辑器中的记录：原样保留
						merged.push({ originalKey: fullRecord.key, key: fullRecord.key, value: fullRecord.value, isNew: false });
					}
					// 已加载但不在编辑器记录中的，视为用户已删除，不再保留
				});
				store.records = merged.concat(newRecords);
			},

			// 为单个对象存储生成写操作计划（纯内存计算与校验，不触碰数据库）。
			// 任何校验失败都会在此抛出异常，保证失败时不产生任何写操作。
			buildIndexedDBWritePlan: function (store, dbInfo) {
				const keyPath = store.keyPath || null;
				const autoIncrement = !!store.autoIncrement;

				// 新对象存储、重命名、重建后，原有记录已随旧存储删除，
				// 因此把当前所有记录都当作新记录写入
				const forceAsNew = store.isNew || store.wasRecreated || (store.originalName && store.originalName !== store.newName);

				// 点号 keyPath（如 'a.b'）逐段取值；数组 keyPath（复合键）逐段取数组键
				const extractKey = (value) => {
					if (value === null || typeof value !== 'object') return undefined;
					const extractOne = (kp) => String(kp).split('.').reduce((obj, seg) => {
						return (obj !== null && typeof obj === 'object') ? obj[seg] : undefined;
					}, value);
					if (Array.isArray(keyPath)) {
						const parts = keyPath.map(kp => extractOne(kp));
						return parts.some(p => p === undefined) ? undefined : parts;
					}
					return extractOne(keyPath);
				};

				// 错误信息中的键描述（二进制/循环引用键无法 JSON 化时兜底）
				const describeKey = (key) => {
					try { return JSON.stringify(key); } catch (e) { return String(key); }
				};

				// 计算实际使用的 key
				const getRecordKey = (record) => {
					if (keyPath) {
						return extractKey(record.value);
					}
					return record.key;
				};

				// 第一阶段：逐条校验并算出目标键
				const entries = store.records.map(record => {
					const isNewRecord = record.isNew || forceAsNew;

					// 校验：带 keyPath 且自增时，value 必须是对象
					if (keyPath && autoIncrement && (record.value === null || typeof record.value !== 'object')) {
						throw new Error('自增且含 Key Path 的对象存储，记录值必须对象，即必须含有 Key Path 所对应的键值对');
					}

					const effectiveKey = getRecordKey(record);

					// 空字符串是合法的 IndexedDB 键，仅 undefined（无法确定键）才拒绝
					if (!keyPath && !autoIncrement && effectiveKey === undefined) {
						throw new Error('记录键不能为空');
					}
					if (keyPath && !autoIncrement && effectiveKey === undefined) {
						throw new Error(`记录值缺少 Key Path ${JSON.stringify(keyPath)} 对应的字段`);
					}
					if (effectiveKey !== undefined && !this.isValidIdbKey(effectiveKey)) {
						throw new Error(`记录键无效（键必须是数字、字符串、日期、二进制数据或数组）: ${describeKey(effectiveKey)}`);
					}

					return { record, isNewRecord, effectiveKey };
				});

				// 校验：新增或被修改的键不得与其他记录的目标键冲突
				entries.forEach((entry, index) => {
					if (entry.effectiveKey === undefined) return;
					const keyIntroduced = entry.record.isNew ||
						(entry.record.originalKey !== undefined && !this.idbKeysEqual(entry.record.originalKey, entry.effectiveKey));
					if (!keyIntroduced) return;
					const duplicated = entries.some((other, otherIndex) => {
						return otherIndex !== index && other.effectiveKey !== undefined &&
							this.idbKeysEqual(other.effectiveKey, entry.effectiveKey);
					});
					if (duplicated) {
						throw new Error(`记录键重复: ${describeKey(entry.effectiveKey)}`);
					}
				});

				// 第二阶段：构造写操作序列。
				// 全部 delete 排在 add/put 之前（先腾空旧键再写新键），避免键互换/链式改键时中途撞键；
				// keyPath 且键变化的记录用 delete + add 而不是 put，目标键被占用时报错而不是静默覆盖。
				const deleteOps = [];
				const writeOps = [];

				if (!forceAsNew && dbInfo) {
					// 删除已不存在的旧记录（按键对象比较，而非引用比较）
					const originalStore = (dbInfo.objectStores || []).find(s => s.name === (store.originalName || store.newName));
					if (originalStore && originalStore.data) {
						originalStore.data.forEach(origRecord => {
							const survives = store.records.some(record => {
								return !record.isNew && record.originalKey !== undefined &&
									this.idbKeysEqual(record.originalKey, origRecord.key);
							});
							if (!survives) {
								deleteOps.push({ type: 'delete', key: origRecord.key });
							}
						});
					}
				}

				entries.forEach(({ record, isNewRecord, effectiveKey }) => {
					// 未修改且未被重建的行不产生任何写操作，原始值原样保留在库中
					if (record.unmodified && !forceAsNew) return;
					const keyChanged = record.originalKey !== undefined && !this.idbKeysEqual(record.originalKey, effectiveKey);

					if (keyPath) {
						// key 包含在 value 中，不能显式传 key
						if (isNewRecord) {
							writeOps.push({ type: 'add', value: record.value });
						} else {
							// key 发生变化：delete + add（目标键被占用时 ConstraintError 报错，而非 put 静默覆盖）
							if (keyChanged) {
								deleteOps.push({ type: 'delete', key: record.originalKey });
								writeOps.push({ type: 'add', value: record.value });
							} else {
								writeOps.push({ type: 'put', value: record.value });
							}
						}
					} else if (autoIncrement) {
						// 自增时，key 可选
						if (isNewRecord) {
							if (effectiveKey === undefined || effectiveKey === '') {
								writeOps.push({ type: 'add', value: record.value });
							} else {
								writeOps.push({ type: 'add', value: record.value, key: effectiveKey });
							}
						} else {
							if (keyChanged) {
								deleteOps.push({ type: 'delete', key: record.originalKey });
								writeOps.push({ type: 'add', value: record.value, key: effectiveKey });
							} else {
								writeOps.push({ type: 'put', value: record.value, key: effectiveKey });
							}
						}
					} else {
						// 无 keyPath 且非自增，必须提供 key（已在第一阶段校验）
						if (isNewRecord) {
							writeOps.push({ type: 'add', value: record.value, key: effectiveKey });
						} else {
							if (keyChanged) {
								deleteOps.push({ type: 'delete', key: record.originalKey });
								writeOps.push({ type: 'add', value: record.value, key: effectiveKey });
							} else {
								writeOps.push({ type: 'put', value: record.value, key: effectiveKey });
							}
						}
					}
				});

				return deleteOps.concat(writeOps);
			},

			// 应用 IndexedDB 记录变更（无结构变更时）。
			// plans 必须已在调用前通过 buildIndexedDBWritePlan 完成全量校验。
			// 所有对象存储的写操作放在同一个事务中：任一条写失败整体回滚，
			// 跨 store 原子，与结构变更路径（单 versionchange 事务）行为一致。
			applyIndexedDBRecordChanges: function (dbName, plans) {
				return new Promise((resolve, reject) => {
					const request = indexedDB.open(dbName);
					request.onerror = () => reject(new Error(`打开数据库 ${dbName} 失败`));
					// 请求无法中途取消，阻塞时不谎报失败：提示后继续等待，其他标签页关闭后自动继续
					request.onblocked = () => { alert(`数据库 ${dbName} 正被其他标签页占用，操作将在其关闭后自动继续`); };

					request.onsuccess = (event) => {
						const db = event.target.result;

						const activePlans = plans.filter(plan =>
							plan.ops.length > 0 && db.objectStoreNames.contains(plan.store.newName));
						if (activePlans.length === 0) {
							db.close();
							resolve();
							return;
						}

						// 一个事务覆盖全部待写对象存储，任一条失败 onerror/onabort → 整体回滚
						let settled = false;
						const storeNames = activePlans.map(p => p.store.newName);
						const transaction = db.transaction(storeNames, 'readwrite');
						const fail = (err) => {
							if (settled) return;
							settled = true;
							db.close();
							reject(err);
						};
						transaction.onerror = () => fail(transaction.error || new Error('写入失败'));
						transaction.onabort = () => fail(transaction.error || new Error('事务已中止，可能存在重复键或其他约束错误'));
						transaction.oncomplete = () => {
							if (settled) return;
							settled = true;
							db.close();
							resolve();
						};

						try {
							activePlans.forEach(plan => {
								const objectStore = transaction.objectStore(plan.store.newName);
								plan.ops.forEach(op => {
									if (op.type === 'delete') {
										objectStore.delete(op.key);
									} else if (op.type === 'add') {
										if (op.key === undefined) {
											objectStore.add(op.value);
										} else {
											objectStore.add(op.value, op.key);
										}
									} else if (op.type === 'put') {
										if (op.key === undefined) {
											objectStore.put(op.value);
										} else {
											objectStore.put(op.value, op.key);
										}
									}
								});
							});
						} catch (e) {
							// 执行期异常：中止事务回滚全部写入，避免只写了一半
							try { transaction.abort(); } catch (e2) { }
							fail(e);
						}
					};
				});
			},

			// 确认删除
			confirmDelete: async function (storageType, key) {
				const isCurrent = !!(this.currentSelection &&
					this.currentSelection.type === storageType && this.currentSelection.key === key);
				// 未保存修改处理：删除正在编辑的项时修改必然随删除丢失；删除其他项时走统一三态处理
				if (this.isDirty) {
					if (isCurrent) {
						// 只警告，不提前清 dirty：最终确认取消时未保存标记仍然有效
						if (!await confirm('正在编辑的“' + key + '”有未保存的更改，删除后这些更改将丢失。是否继续删除？')) return;
					} else {
						const r = await this.resolveDirty();
						if (r === 'cancel') return;
					}
				}
				var alertText = "确定删除 " + key + " 吗？\n\n注意：不建议在这里删除任何数据，可能会引发很多未知问题。";
				if (storageType == 'localStorage') alertText = alertText + "\n删除该存储项后，可能导致网站设置丢失、登录状态失效、部分功能异常。";
				if (storageType == 'sessionStorage') alertText = alertText + "\n删除该存储项后，可能导致当前会话中的网站功能异常，通常刷新或重开标签页后可恢复。";
				if (storageType == 'indexedDB') alertText = alertText + "\n该操作会永久删除整个数据库（全部对象存储、索引与数据），无法恢复。建议先导出备份。";
				if (storageType == 'cacheStorage') alertText = alertText + "\n删除该缓存后，可能导致缓存资源被清空，网站下次加载可能变慢；若网站的 Service Worker 逻辑不完善，可能出现短时异常。";
				if (await confirm(alertText)) {
					await this.doDeleteStorageItem(storageType, key);
				}
			},

			// 删除存储项
			doDeleteStorageItem: async function (storageType, key) {

				try {
					switch (storageType) {
						case 'localStorage':
						case 'sessionStorage':
							this.getWebStorage(storageType).removeItem(key);
							this.removeMtime(storageType, key);
							break;

						case 'indexedDB':
							// 真正删除整个数据库（含全部对象存储、索引与数据）
							await new Promise((resolve, reject) => {
								const delReq = indexedDB.deleteDatabase(key);
								delReq.onsuccess = () => resolve();
								delReq.onerror = () => reject(delReq.error || new Error(`删除数据库 ${key} 失败`));
								// 请求无法中途取消，阻塞时不谎报失败：提示后继续等待，其他标签页关闭后自动继续
								delReq.onblocked = () => { alert(`数据库 ${key} 正被其他标签页占用，操作将在其关闭后自动继续`); };
							});
							delete this._idbStatsCache[key];
							break;

						case 'cacheStorage':
							// 仅删除缓存本身及其资源，不影响 Service Worker 注册
							if ('caches' in window) {
								await caches.delete(key);
							}
							break;
					}

					// 只有删除的是当前选中项时才需要清空编辑器
					const wasSelected = !!(this.currentSelection &&
						this.currentSelection.type === storageType && this.currentSelection.key === key);

					// 重新加载存储项（等待渲染完成后恢复未删除项的选中高亮）
					const listEl = document.getElementById('storageItemsList');
					const scrollTop = listEl ? listEl.scrollTop : 0;
					await this.loadStorageItems(this.currentStorageType);
					if (!wasSelected) this.restoreListSelection(scrollTop);

					// 刷新用量摘要
					this.updateStorageSpaceInfo(this.currentStorageType);

					// 删除的是当前选中项：先清脏标记，绝不再触发“是否保存”（否则会把刚删掉的键写回）
					if (wasSelected) {
						this.clearDirty();
						await this.clearSelection();
					}
				} catch (error) {
					console.error('删除失败:', error);
					alert(`删除失败: ${error.message}`);
				}
				refreshLeftItems();
			},

			// 清除全部存储
			clearAllStorage: async function () {
				if (!this.currentStorageType) {
					alert("请打开任一存储选项卡后再进行操作。");
					return 0;
				}
				// 清空全部会使当前编辑器内容必然失效：先警告，但最终确认通过后才丢弃未保存标记
				if (this.isDirty) {
					if (!await confirm('当前编辑器中有未保存的更改，清空全部存储将丢弃这些更改。是否继续？')) return;
				}
				var alertText = "确定清除所有 " + this.currentStorageType + " 存储吗？\n\n注意：不建议在这里删除任何数据，可能会引发很多未知问题。";
				if (this.currentStorageType == 'localStorage') alertText = alertText + "\n删除 LocalStorage 后，可能导致网站设置丢失、登录状态失效、部分功能异常。";
				if (this.currentStorageType == 'sessionStorage') alertText = alertText + "\n删除 SessionStorage 后，可能导致当前会话中的网站功能异常，通常刷新或重开标签页后可恢复。";
				if (this.currentStorageType == 'indexedDB') alertText = alertText + "\n将清空所有 IndexedDB 数据库中的数据（数据库与对象存储结构保留），可能导致依赖它的网站出现异常，本地数据丢失且难以恢复。";
				if (this.currentStorageType == 'cacheStorage') alertText = alertText + "\n删除 CacheStorage 后，可能导致缓存资源被清空，网站下次加载可能变慢；若网站的 Service Worker 逻辑不完善，可能出现短时异常。";
				if (await confirm(alertText)) {
					// 最终确认已通过，此处才丢弃未保存标记（之后不会再触发“是否保存”）
					this.clearDirty();
					switch (this.currentStorageType) {
						case 'localStorage':
						case 'sessionStorage':
							// 逐键删除以保留工具自身设置（主题、修改时间元数据）
							const webStore = this.getWebStorage(this.currentStorageType);
							for (let i = webStore.length - 1; i >= 0; i--) {
								const k = webStore.key(i);
								if (this.isInternalKey(k, this.currentStorageType)) continue;
								webStore.removeItem(k);
							}
							// 清掉该存储类型的修改时间记录，避免站点重写同名 key 时显示旧时间
							this.clearMtimesFor(this.currentStorageType);
							break;

						case 'indexedDB':
							if (window.indexedDB && window.indexedDB.databases) {
								const failedDbs = [];
								try {
									const databases = await indexedDB.databases();
									// 等待所有数据库清空真正完成后再继续，逐个记录失败
									await Promise.all(databases.map(dbInfo => new Promise((resolve) => {
										let dbFailed = false;
										const failAndResolve = () => {
											if (!dbFailed) { dbFailed = true; failedDbs.push(dbInfo.name); }
											resolve();
										};
										// 打开数据库
										const request = indexedDB.open(dbInfo.name, dbInfo.version);
										// 请求无法中途取消，阻塞时提示后继续等待
										request.onblocked = () => { alert(`数据库 ${dbInfo.name} 正被其他标签页占用，清空将在其关闭后自动继续`); };
										request.onsuccess = (event) => {
											const db = event.target.result;
											const storeNames = Array.from(db.objectStoreNames);
											if (storeNames.length === 0) {
												db.close();
												resolve();
												return;
											}
											let completed = 0;
											const done = (failed) => {
												if (failed) dbFailed = true;
												completed++;
												if (completed === storeNames.length) {
													db.close(); // 操作完成后关闭数据库
													if (dbFailed) failedDbs.push(dbInfo.name);
													resolve();
												}
											};
											// 遍历所有对象存储
											storeNames.forEach(storeName => {
												// 读写
												const transaction = db.transaction(storeName, 'readwrite');
												const objectStore = transaction.objectStore(storeName);
												// 清空当前对象存储的所有数据
												const clearRequest = objectStore.clear();

												clearRequest.onsuccess = () => {
													console.log(`对象存储 ${storeName} 数据已清空`);
												};
												clearRequest.onerror = (e) => {
													console.error(`清空 ${storeName} 失败:`, e.target.error);
												};
												transaction.oncomplete = () => done(false);
												transaction.onerror = () => done(true);
												transaction.onabort = () => done(true);
											});
										};
										request.onerror = (e) => {
											console.error(`打开数据库 ${dbInfo.name} 失败:`, e.target.error);
											failAndResolve();
										};
									})));
								} catch (error) {
									console.error('获取数据库列表失败:', error);
									failedDbs.push('（获取数据库列表失败）');
								}
								console.log('已删除所有IndexedDB数据，但结构保留');
								this._idbStatsCache = Object.create(null);
								if (failedDbs.length === 0) {
									alert(`已删除所有 IndexedDB 数据，但结构保留`);
								} else {
									alert(`清空部分失败，以下数据库未能完全清空：\n${failedDbs.join('\n')}`);
								}
							} else {
								alert('您的浏览器不支持 IndexedDB 数据库枚举，无法执行清空');
							}
							break;

						case 'cacheStorage':
							await caches.keys().then(cacheNames => {
								return Promise.all(
									cacheNames.map(cacheName => caches.delete(cacheName))
								);
							});
							console.log('已删除所有缓存');
							alert(`已删除所有缓存`);
							break;
					}

					// 重新加载存储项
					this.loadStorageItems(this.currentStorageType);

					// 刷新用量摘要
					this.updateStorageSpaceInfo(this.currentStorageType);

					// 清除编辑器（脏标记已在入口处理，不会再触发“是否保存”）
					this.clearDirty();
					await this.clearSelection();
				}
				refreshLeftItems();
			},

			// 更新存储空间信息
			updateStorageSpaceInfo: async function (storageType) {
				// 竞态令牌：快速切换类型时，过期统计结果不得覆盖新类型的显示
				const token = ++this._spaceToken;
				let usedSpace = 0;
				let totalSpace = 0;
				let usedEstimated = false;
				let totalEstimated = false;
				let usedTitle = '';
				let totalTitle = '';

				try {
					switch (storageType) {
						case 'localStorage':
						case 'sessionStorage': {
							const store = this.getWebStorage(storageType);
							// 已用空间（按 UTF-16 码元计量，与浏览器口径一致；不含工具内部键）
							for (let i = 0; i < store.length; i++) {
								const key = store.key(i);
								if (this.isInternalKey(key, storageType)) continue;
								const value = store.getItem(key);
								usedSpace += this.localStorageEntrySize(key, value);
							}
							// 总容量无 API 可读，按保守的 5MB 估算
							totalSpace = 5 * 1024 * 1024;
							totalEstimated = true;
							usedTitle = storageType + ' 已用（按键和值的 UTF-16 长度计算）';
							totalTitle = storageType + ' 配额无 API 可读，浏览器通常为 5-10MB，此为保守估算';
							break;
						}

						case 'indexedDB': {
							const indexedDBInfo = await this.calculateIndexedDBSpace();
							usedSpace = indexedDBInfo.used;
							totalSpace = indexedDBInfo.total;
							usedEstimated = indexedDBInfo.usedEstimated;
							totalEstimated = indexedDBInfo.totalEstimated;
							usedTitle = usedEstimated ? 'IndexedDB 已用（估算）' : 'IndexedDB 已用（精确）';
							totalTitle = totalEstimated ? '整个源的配额未知，此为估算值' : '整个源的配额（所有存储类型共享）';
							break;
						}

						case 'cacheStorage': {
							const cacheInfo = await this.calculateCacheStorageSpace();
							usedSpace = cacheInfo.used;
							totalSpace = cacheInfo.total;
							usedEstimated = cacheInfo.usedEstimated;
							totalEstimated = cacheInfo.totalEstimated;
							usedTitle = usedEstimated ? 'CacheStorage 已用（估算）' : 'CacheStorage 已用（精确）';
							totalTitle = totalEstimated ? '整个源的配额未知，此为估算值' : '整个源的配额（所有存储类型共享）';
							break;
						}
					}
				} catch (error) {
					console.error("计算存储空间失败:", error);
					usedSpace = 0;
					totalSpace = 0;
				}

				if (token !== this._spaceToken) return; // 过期结果不写入 UI

				// 更新UI（估算值加"约"前缀，并在 title 中说明口径）
				const usedSpaceEl = document.getElementById('usedSpace');
				const totalSpaceEl = document.getElementById('totalSpace');
				usedSpaceEl.textContent = (usedEstimated ? '约 ' : '') + this.formatBytes(usedSpace);
				totalSpaceEl.textContent = (totalEstimated ? '约 ' : '') + this.formatBytes(totalSpace);
				usedSpaceEl.title = usedTitle;
				totalSpaceEl.title = totalTitle;

				// 更新进度条
				const percentage = totalSpace > 0 ? Math.min(100, Math.round((usedSpace / totalSpace) * 100)) : 0;
				document.getElementById('usageProgress').style.width = `${percentage}%`;
			},


			// localStorage 单项大小：浏览器按 UTF-16 码元计量（每码元 2 字节），value 为 null 时按 '' 处理
			localStorageEntrySize: function (key, value) {
				return ((key ? key.length : 0) + (value ? value.length : 0)) * 2;
			},

			// 计算单个 IndexedDB 数据库的统计信息（记录数 + 字节大小，游标流式累计）。
			// 结果按库名缓存（列表/摘要/详情共用，避免重复全量扫描），
			// 本工具内的写操作（保存/删除/导入/清空）会主动失效对应缓存。
			getDatabaseStats: function (dbName, forceRefresh) {
				if (!forceRefresh && this._idbStatsCache[dbName]) {
					return Promise.resolve(this._idbStatsCache[dbName]);
				}
				return new Promise((resolve) => {
					const request = indexedDB.open(dbName);
					// 请求无法中途取消，阻塞时提示后继续等待
					request.onblocked = () => { alert(`数据库 ${dbName} 正被其他标签页占用，读取将在其关闭后自动继续`); };
					request.onsuccess = (event) => {
						const db = event.target.result;
						if (db.objectStoreNames.length === 0) {
							db.close();
							const empty = { count: 0, size: 0 };
							this._idbStatsCache[dbName] = empty;
							resolve(empty);
							return;
						}
						let count = 0;
						let size = 0;
						let completed = 0;

						Array.from(db.objectStoreNames).forEach(storeName => {
							const transaction = db.transaction(storeName, 'readonly');
							const store = transaction.objectStore(storeName);

							// 记录数
							const countRequest = store.count();
							countRequest.onsuccess = (e) => {
								count += e.target.result;
							};

							// 字节大小（通过游标累计，避免大量数据入内存）
							const cursorRequest = store.openCursor();
							cursorRequest.onsuccess = (e) => {
								const cursor = e.target.result;
								if (cursor) {
									size += this.calculateRecordSize(cursor.value);
									cursor.continue();
								}
							};

							const finish = () => {
								completed++;
								if (completed === db.objectStoreNames.length) {
									db.close();
									const stats = { count, size };
									this._idbStatsCache[dbName] = stats;
									resolve(stats);
								}
							};
							transaction.oncomplete = finish;
							transaction.onerror = finish;
						});
					};
					request.onerror = () => resolve({ count: 0, size: 0 });
				});
			},

			// 计算IndexedDB空间
			// 已用大小：优先取 estimate().usageDetails.indexedDB（精确）；
			// 否则枚举所有数据库逐项求和（估算），并以整个源的总占用作为上限。
			// 总量：estimate().quota（整个源共享的配额）。
			calculateIndexedDBSpace: async function () {
				let total = 0;
				let totalEstimated = true;
				let originUsage;
				if (navigator.storage && navigator.storage.estimate) {
					try {
						const estimation = await navigator.storage.estimate();
						if (Number.isFinite(estimation.quota)) {
							total = estimation.quota;
							totalEstimated = false;
						}
						originUsage = estimation.usage;
						// Chrome 非标准属性 usageDetails 中可能包含按类型拆分的精确用量
						const details = estimation.usageDetails;
						if (details && Number.isFinite(details.indexedDB)) {
							return { used: details.indexedDB, total: total, usedEstimated: false, totalEstimated: totalEstimated };
						}
					} catch (e) {
						console.error('获取存储估算失败:', e);
					}
				}

				let used = 0;
				if (window.indexedDB && window.indexedDB.databases) {
					// 逐项求和（估算）
					try {
						const databases = await indexedDB.databases();
						for (const dbInfo of databases) {
							const stats = await this.getDatabaseStats(dbInfo.name);
							used += stats.size;
						}
					} catch (e) {
						console.error('统计 IndexedDB 大小失败:', e);
					}
				} else if (Number.isFinite(originUsage)) {
					// 更粗的兜底：无法枚举数据库时退化为整个源的总占用
					used = originUsage;
				}
				// 合理性约束：逐项之和不应超过整个源的总占用
				if (Number.isFinite(originUsage) && used > originUsage) {
					used = originUsage;
				}
				if (total === 0) {
					total = 50 * 1024 * 1024; // 默认50MB（估算）
					totalEstimated = true;
				}
				return { used: used, total: total, usedEstimated: true, totalEstimated: totalEstimated };
			},

			// 计算CacheStorage空间
			// 已用大小：优先取 estimate().usageDetails.caches（精确）；
			// 否则遍历所有缓存逐项求和（估算），并以整个源的总占用作为上限。
			// 总量：estimate().quota（整个源共享的配额）。
			calculateCacheStorageSpace: async function () {
				let total = 0;
				let totalEstimated = true;
				let originUsage;
				if (navigator.storage && navigator.storage.estimate) {
					try {
						const estimation = await navigator.storage.estimate();
						if (Number.isFinite(estimation.quota)) {
							total = estimation.quota;
							totalEstimated = false;
						}
						originUsage = estimation.usage;
						// Chrome 非标准属性 usageDetails 中可能包含按类型拆分的精确用量
						const details = estimation.usageDetails;
						if (details && Number.isFinite(details.caches)) {
							return { used: details.caches, total: total, usedEstimated: false, totalEstimated: totalEstimated };
						}
					} catch (e) {
						console.error('获取存储估算失败:', e);
					}
				}

				let used = 0;
				if ('caches' in window) {
					// 逐项求和（估算）
					try {
						const cacheNames = await caches.keys();
						for (const name of cacheNames) {
							const cache = await caches.open(name);
							const requests = await cache.keys();
							used += await this.calculateCacheSize(cache, requests);
						}
					} catch (e) {
						console.error('统计 CacheStorage 大小失败:', e);
					}
				} else if (Number.isFinite(originUsage)) {
					// 更粗的兜底：无 caches API 时退化为整个源的总占用
					used = originUsage;
				}
				// 合理性约束：逐项之和不应超过整个源的总占用
				if (Number.isFinite(originUsage) && used > originUsage) {
					used = originUsage;
				}
				if (total === 0) {
					total = 100 * 1024 * 1024; // 默认100MB（估算）
					totalEstimated = true;
				}
				return { used: used, total: total, usedEstimated: true, totalEstimated: totalEstimated };
			},

			// 辅助-格式化字节大小
			formatBytes: function (bytes, decimals = 2) {
				if (!Number.isFinite(bytes) || bytes <= 0) return '0 Bytes';

				const k = 1024;
				const dm = decimals < 0 ? 0 : decimals;
				const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];

				const i = Math.floor(Math.log(bytes) / Math.log(k));

				// 小于1KB时显示Bytes
				if (i === 0) {
					return bytes + ' ' + sizes[i];
				}

				return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
			}
		};

		// 初始化
		document.addEventListener('DOMContentLoaded', function () {
			storageManager.init();
		});

		// 抽屉下滑关闭：窄屏（≤440px）下 .shortcutmodal 变为底部抽屉，
		// 附加"下滑跟手、松手按速度+距离综合判定关闭、否则回弹原位"的手势（触摸与鼠标均支持），
		// 关闭动作复用各弹窗已有的背板点击逻辑；松手瞬间正在上滑（反悔）则无条件回弹。
		// 性能设计：全程只常驻 touchstart/mousedown 两个入口监听；move/end 监听仅在单次手势存续期间挂载、松手即移除，
		// 弹窗未打开或非抽屉模式时零开销；跟手只写 transform（合成层），不触发重排。
		(function () {
			var drawerMQ = window.matchMedia('(max-width: 440px)');
			var DECIDE_PX = 3;   // 方向裁决阈值：位移超过它才判定手势方向
			var CLOSE_DIST = 100;   // 纯距离路径：松手时下拉距离超过它才关闭
			var FLICK_DIST = 20;    // 速度路径：快速下甩的最小位移
			var FLICK_VY = 0.5;     // 速度路径：松手速度达到它（px/ms，约 500px/s）即视为快速下甩
			var UP_CANCEL_VY = -0.1; // 松手瞬间速度低于它视为正在上滑（反悔），无条件回弹
			var VEL_WINDOW = 100;   // 速度采样窗口（ms）：只取松手前最近这段的位移算速度
			var g = null;        // 当前手势状态，null = 无进行中手势
			var suppressUntil = 0, suppressX = 0, suppressY = 0; // 拖动松手后吞掉尾随原生 click 的时间窗+坐标

			// 触摸点向上的可滚动祖先（到抽屉容器为止）是否全部停在顶部
			function scrollsAtTop(target, content) {
				var el = target;
				while (el && el !== content) {
					if (el.scrollTop > 0) return false;
					el = el.parentElement;
				}
				return content.scrollTop <= 0;
			}

			// 手势核心：与事件源（touch/mouse）无关，事件处理只做坐标提取的薄封装
			function begin(target, x, y, isTouch) {
				var modal = target.closest && target.closest('.shortcutmodal.active');
				if (!modal) return;
				var content = modal.querySelector('.shortcutmodal-content');
				if (!content || !content.contains(target)) return;
				g = {
					modal: modal, content: content, target: target,
					startX: x, startY: y,
					decided: false, dragging: false,
					samples: [] // 速度采样：扁平数组 [t0,y0, t1,y1, ...]，仅保留最近 VEL_WINDOW 毫秒
				};
				if (isTouch) {
					document.addEventListener('touchmove', onTouchMove, { capture: true, passive: false });
					document.addEventListener('touchend', onTouchEnd, true);
					document.addEventListener('touchcancel', onTouchEnd, true);
				} else {
					document.addEventListener('mousemove', onMouseMove, true);
					document.addEventListener('mouseup', onMouseUp, true);
				}
			}

			function move(x, y, preventDefault) {
				if (!g) return;
				var dx = x - g.startX;
				var dy = y - g.startY;
				if (!g.decided) {
					if (Math.abs(dx) < DECIDE_PX && Math.abs(dy) < DECIDE_PX) return;
					g.decided = true;
					// 仅"向下 + 内部滚动全部在顶部"才接管手势；向上/横向/内部可滚动时完全放行
					if (dy > 0 && scrollsAtTop(g.target, g.content)) {
						g.dragging = true;
						g.content.style.transition = 'none'; // 跟手期间停掉 CSS 过渡
					}
				}
				if (!g.dragging) return;
				preventDefault(); // 触摸：阻止抽屉内部滚动与页面滚动；鼠标：阻止文本选中
				var now = performance.now();
				var s = g.samples;
				s.push(now, y);
				while (s.length > 4 && now - s[0] > VEL_WINDOW) s.splice(0, 2); // 只留最近一个采样窗口
				g.content.style.transform = 'translateY(' + (dy > 0 ? dy : 0) + 'px)'; // 1:1 跟手，向上回拉时钳制在原位
			}

			function end(x, y) {
				if (!g) return;
				var dy = y - g.startY;
				var modal = g.modal, content = g.content, dragging = g.dragging, samples = g.samples;
				document.removeEventListener('touchmove', onTouchMove, true);
				document.removeEventListener('touchend', onTouchEnd, true);
				document.removeEventListener('touchcancel', onTouchEnd, true);
				document.removeEventListener('mousemove', onMouseMove, true);
				document.removeEventListener('mouseup', onMouseUp, true);
				g = null;
				if (!dragging) return;
				// 松手速度：按松手时刻修剪采样，取最近 VEL_WINDOW 毫秒的位移/时间；按住不动再松手时采样过期、速度归零，只按距离判
				var releaseT = performance.now();
				while (samples.length > 2 && releaseT - samples[0] > VEL_WINDOW) samples.splice(0, 2);
				var vy = 0;
				if (samples.length >= 4) {
					var vdt = samples[samples.length - 2] - samples[0];
					if (vdt > 0) vy = (samples[samples.length - 1] - samples[1]) / vdt;
				}
				// 清除内联样式交还 CSS：未达关闭条件时过渡自动回弹原位；关闭时从当前位移接续播放既有退场动画
				content.style.transition = '';
				content.style.transform = '';
				// 关闭判定：正在上滑（反悔）无条件回弹；否则慢拖超距或快速下甩其一即关闭
				var shouldClose = vy > UP_CANCEL_VY &&
					(dy >= CLOSE_DIST || (dy >= FLICK_DIST && vy >= FLICK_VY));
				if (shouldClose && modal.classList.contains('active')) {
					modal.click(); // 合成背板点击，触发 e.target === modal 的现有关闭处理器
					if (modal.classList.contains('active')) modal.classList.remove('active'); // 无背板关闭处理器的弹窗兜底
				}
				// 吞掉本次拖动尾随的原生 click：按时间窗+松手坐标判定，400ms 后自动过期，不误伤后续正常点击。
				// 必须在 modal.click() 之后开启时间窗：合成 click 坐标为 (0,0)，否则左上角松手时会误吞掉关闭点击
				suppressUntil = performance.now() + 400;
				suppressX = x;
				suppressY = y;
			}

			function onTouchStart(e) {
				if (g || e.touches.length !== 1 || !drawerMQ.matches ||
					document.body.classList.contains('no-drawer-mode')) return;
				var t = e.touches[0];
				begin(e.target, t.clientX, t.clientY, true);
			}

			function onTouchMove(e) {
				var t = e.touches[0];
				move(t.clientX, t.clientY, function () { e.preventDefault(); });
			}

			function onTouchEnd(e) {
				var t = e.changedTouches[0];
				end(t.clientX, t.clientY);
			}

			function onMouseDown(e) {
				if (g || e.button !== 0 || !drawerMQ.matches ||
					document.body.classList.contains('no-drawer-mode')) return;
				begin(e.target, e.clientX, e.clientY, false);
			}

			function onMouseMove(e) {
				move(e.clientX, e.clientY, function () { e.preventDefault(); });
			}

			function onMouseUp(e) {
				end(e.clientX, e.clientY);
			}

			// 捕获阶段吞掉拖动后的原生 click（不依赖 click 的 target 重定向，部分移动端内核重定向不规范）
			document.addEventListener('click', function (e) {
				if (performance.now() <= suppressUntil &&
					Math.abs(e.clientX - suppressX) < 40 && Math.abs(e.clientY - suppressY) < 40) {
					suppressUntil = 0;
					e.stopPropagation();
					e.preventDefault();
				}
			}, true);

			document.addEventListener('touchstart', onTouchStart, { capture: true, passive: true });
			document.addEventListener('mousedown', onMouseDown, true);
		})();
	</script>
</body>
